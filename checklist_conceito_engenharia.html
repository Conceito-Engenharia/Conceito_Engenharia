<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Checklist Conceito Engenharia</title>
<style>
  :root{
    --accent: #202C52;
    --accent-light: #34457F;
    --on-accent: #FFFFFF;
    --navy: #202C52;

    /* tema claro (padrão): branco + azul marinho */
    --bg: #F4F6FB;
    --header-bg: #FFFFFF;
    --header-border: #DCE1EE;
    --header-text: #202C52;
    --header-text-secondary: #5D6788;
    --header-btn-border: #C9D0E4;
    --header-btn-text: #202C52;
    --header-btn-hover-bg: #EEF1F9;
    --header-track-bg: #DCE1EE;
    --card: #FFFFFF;
    --card-alt: #F7F9FD;
    --border: #DCE1EE;
    --text: #141B33;
    --text-secondary: #5D6788;
    --sidebar-bg: #FFFFFF;
    --sidebar-border: #DCE1EE;
    --sidebar-text: #5D6788;
    --sidebar-text-hover: #141B33;
    --sidebar-hover-bg: #F4F6FB;
    --sidebar-active-bg: #E8ECF7;
    --sidebar-active-text: #202C52;
    --sidebar-count: #7B84A3;
    --chip-bg: #E8ECF7;
    --chip-border: #C9D0E4;
    --track-bg: #E3E7F2;
  }
  body.theme-dark{
    --accent: #4F65B8;
    --accent-light: #6F84D2;
    --on-accent: #FFFFFF;

    --bg: #0E1428;
    --header-bg: #202C52;
    --header-border: #202C52;
    --header-text: #FFFFFF;
    --header-text-secondary: #B9C2E0;
    --header-btn-border: #4A5A8F;
    --header-btn-text: #FFFFFF;
    --header-btn-hover-bg: #2A3866;
    --header-track-bg: #34457F;
    --card: #172041;
    --card-alt: #1D2750;
    --border: #2C3868;
    --text: #EEF1FA;
    --text-secondary: #9AA5C8;
    --sidebar-bg: #172041;
    --sidebar-border: #172041;
    --sidebar-text: #B9C2E0;
    --sidebar-text-hover: #FFFFFF;
    --sidebar-hover-bg: #1D2750;
    --sidebar-active-bg: #2A3866;
    --sidebar-active-text: #FFFFFF;
    --sidebar-count: #7B84A3;
    --chip-bg: #22305F;
    --chip-border: #34457F;
    --track-bg: #2C3868;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background-color .15s ease, color .15s ease;
  }
  .wrap{max-width:1300px;margin:0 auto;padding:0;}

  header{
    background: var(--header-bg);
    border-bottom: 1px solid var(--header-border);
    padding: 24px 28px 22px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
  }
  .logo-badge{
    background:var(--navy);
    border-radius:10px;
    padding:6px 12px;
    display:flex;
    align-items:center;
    flex-shrink:0;
  }
  .logo-badge img{height:64px;display:block;}
  .header-text{flex:1;min-width:220px;}
  .header-text h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    color: var(--header-text);
    letter-spacing:0.5px;
  }
  .header-text p{
    margin:4px 0 0;
    font-size:13px;
    color:var(--header-text-secondary);
  }
  .header-progress{min-width:180px;}
  .header-progress .label{
    font-size:12px;color:var(--header-text-secondary);margin-bottom:6px;display:flex;justify-content:space-between;
  }
  .header-progress .label b{color:var(--header-text);font-weight:700;}
  .track{
    height:8px;border-radius:4px;background:var(--header-track-bg);overflow:hidden;
  }
  .fill{
    height:100%;background:var(--accent);border-radius:4px;transition:width .25s ease;
  }
  body.theme-dark .header-progress .fill{background:var(--accent-light);}
  .print-btn{
    background:transparent;border:1px solid var(--header-btn-border);color:var(--header-btn-text);
    padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;
    display:flex;align-items:center;gap:6px;
  }
  .print-btn:hover{background:var(--header-btn-hover-bg);}
  .theme-toggle-btn{
    background:transparent;border:1px solid var(--header-btn-border);color:var(--header-btn-text);
    width:38px;height:38px;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .theme-toggle-btn:hover{background:var(--header-btn-hover-bg);}
  .theme-toggle-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}
  .theme-toggle-btn .icon-sun{display:none;}
  body.theme-dark .theme-toggle-btn .icon-moon{display:none;}
  body.theme-dark .theme-toggle-btn .icon-sun{display:block;}

  .layout{
    display:flex;
    align-items:flex-start;
  }

  .sidebar{
    flex:0 0 260px;
    background:var(--sidebar-bg);
    border-right:1px solid var(--sidebar-border);
    min-height:100%;
    padding:16px 10px;
  }
  .new-sala-btn{
    margin:16px 4px 4px;
    padding:10px 10px;font-size:12.5px;font-weight:700;
    background:transparent;border:1px dashed var(--accent);color:var(--accent);
    border-radius:8px;cursor:pointer;text-align:center;width:calc(100% - 8px);
  }
  .new-sala-btn:hover{background:var(--sidebar-hover-bg);}

  .nav-section{margin-bottom:2px;}
  .nav-btn{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:11px 12px;font-size:13.5px;font-weight:700;color:var(--sidebar-text);
    background:transparent;border:none;border-radius:10px;cursor:pointer;text-align:left;
  }
  .nav-btn:hover{background:var(--sidebar-hover-bg);}
  .nav-btn.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text);}
  .nav-btn .nav-icon{
    flex-shrink:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  }
  .nav-btn .nav-icon svg{width:18px;height:18px;stroke:currentColor;}
  .nav-btn .nav-label{flex:1;}
  .nav-btn .nav-arrow{
    font-size:9px;color:var(--sidebar-count);transition:transform .15s ease;flex-shrink:0;
  }
  .nav-btn.expanded .nav-arrow{transform:rotate(90deg);color:var(--sidebar-active-text);}
  .nav-sublist{
    display:none;flex-direction:column;gap:2px;padding:2px 2px 10px 30px;
  }
  .nav-sublist.expanded{display:flex;}

  .add-task-btn{
    display:inline-flex;align-items:center;gap:6px;
    margin-bottom:14px;padding:9px 14px;font-size:13px;font-weight:700;
    background:var(--accent);border:none;color:#fff;border-radius:8px;cursor:pointer;
  }
  .add-task-btn:hover{background:var(--accent-light);}

  .archive-btn{
    display:inline-flex;align-items:center;gap:6px;
    margin-bottom:14px;margin-left:10px;padding:9px 14px;font-size:13px;font-weight:700;
    background:transparent;border:1px solid var(--border);color:var(--text-secondary);
    border-radius:8px;cursor:pointer;
  }
  .archive-btn:hover{border-color:var(--accent);color:var(--accent);}
  .archive-btn.future-toggle-all{margin:0;}

  .sala-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:start;}
  .sala-layout.panel-collapsed{grid-template-columns:minmax(0,1fr) 44px;}
  .projects-panel{
    position:sticky;top:16px;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:14px;
  }
  .projects-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .projects-head h3{margin:0;font-size:14px;font-weight:700;color:var(--text);}
  .projects-collapse{
    background:none;border:none;color:var(--text-secondary);cursor:pointer;font-size:15px;
    padding:2px 6px;border-radius:6px;
  }
  .projects-collapse:hover{color:var(--accent);background:var(--card-alt);}
  .projects-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .project-item{display:flex;align-items:stretch;gap:4px;}
  .project-open{
    flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:8px;
    background:var(--card-alt);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:9px 10px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .project-open:hover{border-color:var(--accent);color:var(--accent);}
  .project-open span.project-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .project-edit{
    flex-shrink:0;background:none;border:none;color:var(--text-secondary);cursor:pointer;
    padding:2px 4px;border-radius:6px;display:flex;align-items:center;
  }
  .project-edit:hover{color:var(--accent);background:var(--card-alt);}
  .project-edit svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
  .projects-empty{font-size:12px;color:var(--text-secondary);margin:0 0 10px;line-height:1.4;}
  .projects-add{
    width:100%;background:transparent;border:1px dashed var(--accent);color:var(--accent);
    border-radius:8px;padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .projects-add:hover{background:var(--card-alt);}
  .projects-panel.collapsed{padding:8px 4px;text-align:center;}
  .projects-panel.collapsed .projects-head{flex-direction:column;margin:0;}
  .projects-expand{background:none;border:none;cursor:pointer;font-size:18px;padding:4px;color:var(--text-secondary);}
  .projects-expand:hover{color:var(--accent);}
  .projects-count{font-size:10.5px;font-weight:700;color:var(--text-secondary);}
  @media (max-width: 1100px){
    .sala-layout, .sala-layout.panel-collapsed{grid-template-columns:minmax(0,1fr);}
    .projects-panel{position:static;order:-1;}
    .projects-list{flex-direction:row;flex-wrap:wrap;}
    .project-item{flex:0 1 auto;max-width:100%;}
    .projects-add{width:auto;padding:8px 14px;}
    .projects-panel.collapsed{text-align:left;}
    .projects-panel.collapsed .projects-head{flex-direction:row;}
  }

  .sala-actions-row{
    display:flex;align-items:flex-start;justify-content:space-between;
    flex-wrap:wrap;gap:10px;
  }
  .sala-actions-left{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;}
  .sala-actions-right{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;}
  .project-link-row{display:inline-flex;align-items:center;gap:6px;margin:0;}
  .project-link-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:9px 14px;font-size:13px;font-weight:700;
    background:transparent;border:1px solid var(--border);color:var(--text);
    border-radius:8px;cursor:pointer;
  }
  .project-link-btn:hover{border-color:var(--accent);color:var(--accent);}
  .project-link-edit{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;background:transparent;border:1px solid var(--border);
    color:var(--text-secondary);border-radius:8px;cursor:pointer;flex-shrink:0;
  }
  .project-link-edit:hover{border-color:var(--accent);color:var(--accent);}
  .project-link-edit svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(10,10,10,0.5);
    align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal-overlay.show{display:flex;}
  .modal-card{
    background:var(--card);border-radius:12px;max-width:420px;width:100%;
    padding:22px;box-shadow:0 12px 40px rgba(0,0,0,0.25);
    max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .modal-card h3{margin:0 0 16px;font-size:16px;font-weight:700;color:var(--text);}
  .modal-card.wide{max-width:860px;}
  .modal-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;align-items:start;}
  .modal-col{min-width:0;}
  .modal-row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .modal-row2 .modal-hint{margin-top:5px;}
  .modal-card.wide .modal-field textarea{min-height:0;}
  @media (max-width: 720px){
    .modal-cols, .modal-row2{grid-template-columns:1fr;}
  }
  .modal-field{margin-bottom:14px;}
  .modal-field label{
    display:block;font-size:12px;font-weight:700;color:var(--text-secondary);
    margin-bottom:5px;
  }
  .modal-field input[type="text"], .modal-field select, .modal-field textarea{
    width:100%;padding:9px 10px;font-size:14px;border:1px solid var(--border);
    border-radius:6px;font-family:inherit;box-sizing:border-box;background:var(--card);color:var(--text);
  }
  .modal-field textarea{resize:vertical;line-height:1.5;}
  .mode-toggle{display:flex;gap:6px;}
  .mode-btn{
    flex:1;padding:8px 10px;font-size:12.5px;font-weight:700;border-radius:6px;
    border:1px solid var(--border);background:var(--card);color:var(--text-secondary);cursor:pointer;
  }
  .mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .modal-days{display:flex;flex-wrap:wrap;gap:6px;}
  .modal-day-chip{
    font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;
    border:1px solid var(--border);background:var(--card);color:var(--text-secondary);cursor:pointer;
  }
  .modal-day-chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .modal-hint{font-size:11.5px;color:var(--text-secondary);margin-top:6px;}

  .quick-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;background:var(--bg);
  }
  .quick-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:28px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,0.10);
  }
  .quick-logo{display:flex;justify-content:center;margin-bottom:16px;}
  .quick-logo img{height:72px;border-radius:10px;}
  .quick-card h1{font-size:19px;margin:0 0 18px;text-align:center;color:var(--text);}
  .quick-sub{font-size:13px;color:var(--text-secondary);margin:0 0 16px;text-align:center;}
  .quick-hint{font-size:11.5px;color:var(--text-secondary);margin:6px 0 4px;}
  .quick-btn{
    width:100%;padding:12px;font-size:14px;font-weight:700;border-radius:8px;
    border:none;background:var(--accent);color:#fff;cursor:pointer;margin-top:8px;
  }
  .quick-btn:hover{background:var(--accent-light);}
  .quick-btn:disabled{opacity:0.6;cursor:default;}
  .quick-success{
    color:#1a7a3c;font-size:13px;margin-top:10px;display:none;font-weight:700;text-align:center;
  }
  .quick-success.show{display:block;}
  .modal-actions{
    display:flex;justify-content:flex-end;gap:10px;margin-top:18px;
    position:sticky;bottom:-22px;background:var(--card);
    padding:12px 0 22px;margin-bottom:-22px;z-index:2;
    border-top:1px solid var(--border, rgba(128,128,128,0.2));
  }
  .modal-btn{
    padding:9px 16px;font-size:13px;font-weight:700;border-radius:7px;cursor:pointer;border:none;
  }
  .modal-btn-cancel{background:var(--card-alt);color:var(--text);}
  .modal-btn-danger{background:transparent;color:#C0392B;border:1px solid #E0A8A0;}
  .modal-btn-danger:hover{background:#FCEBEA;}
  .modal-btn-confirm{background:var(--accent);color:#fff;}
  .modal-btn-confirm:hover{background:var(--accent-light);}
  .modal-error{color:#E5484D;font-size:12px;margin-top:8px;display:none;}
  .modal-error.show{display:block;}

  .tab{
    padding:8px 10px;font-size:12.5px;font-weight:600;color:var(--sidebar-text);
    background:transparent;border:none;border-left:2px solid transparent;border-radius:6px;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;
    text-align:left;
    line-height:1.25;
  }
  .tab span:first-child{white-space:normal;word-break:break-word;}
  .tab:hover{background:var(--sidebar-hover-bg);color:var(--sidebar-text-hover);}
  .tab.active{color:var(--sidebar-active-text);border-left:2px solid var(--accent);background:var(--sidebar-active-bg);}
  .tab .count{
    display:inline-block;font-size:10.5px;font-weight:700;
    color:var(--sidebar-count);
  }
  .tab-empty{
    padding:8px 10px;font-size:11.5px;color:var(--sidebar-count);font-style:italic;
  }

  main{flex:1;min-width:0;padding:20px 24px 40px;}
  .employee-name{
    font-size:20px;font-weight:700;color:var(--text);margin:4px 0 14px;
  }
  .employee-progress{
    display:flex;align-items:center;gap:12px;margin-bottom:18px;
  }
  .employee-progress .track{flex:1;background:var(--track-bg);height:8px;}
  .employee-progress .fill{background:var(--accent);}
  .employee-progress .pct{font-size:13px;font-weight:700;color:var(--text);min-width:70px;text-align:right;}

  .sala-board{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
  }
  .sala-card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    overflow:hidden;
    flex:1 1 250px;
    max-width:320px;
  }
  .sala-head{
    padding:12px 16px;background:var(--card-alt);border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
  }
  .sala-head h3{margin:0;font-size:14px;font-weight:700;color:var(--text);}
  .sala-head .sala-count{font-size:12px;color:var(--text-secondary);}
  .task-list{list-style:none;margin:0;padding:6px 8px;}
  .task-item{
    display:flex;align-items:flex-start;gap:10px;padding:9px 8px;border-radius:6px;
  }
  .task-item:hover{background:var(--card-alt);}
  .task-item input{
    margin-top:2px;width:16px;height:16px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;
  }
  .task-item-body{flex:1;min-width:0;}
  .task-item label{font-size:14px;line-height:1.4;cursor:pointer;display:block;color:var(--text);}
  .task-item.done label{color:var(--text-secondary);text-decoration:line-through;}

  .task-item.needs-material{
    background:rgba(220,38,38,0.07);border-left:3px solid #DC2626;
    border-radius:6px;padding-left:8px;margin-left:-2px;
  }
  .task-item.needs-material:hover{background:rgba(220,38,38,0.12);}
  .task-item.priority > .task-item-body label,
  .task-item.priority > .task-item-body .task-item-row label{font-weight:800;}
  .priority-star{color:var(--accent);margin-right:4px;}
  .calendar-chip.priority{font-weight:800;}
  .subitem-list{list-style:none;margin:6px 0 0;padding:0 0 0 4px;border-left:2px solid var(--border, rgba(128,128,128,0.3));}
  .subitem-list li{display:flex;align-items:flex-start;gap:8px;padding:3px 0 3px 8px;}
  .subitem-list input[type=checkbox]{margin-top:3px;flex-shrink:0;}
  .subitem-list label{font-size:13px;font-weight:400 !important;cursor:pointer;color:var(--text);}
  .subitem-list li.sub-done label{text-decoration:line-through;color:var(--text-secondary);}
  .subitem-count{font-size:10.5px;font-weight:700;color:var(--text-secondary);background:var(--card-alt);padding:2px 8px;border-radius:10px;margin-top:6px;display:inline-block;margin-right:6px;}
  .material-badge{
    display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
    color:#DC2626;background:rgba(220,38,38,0.14);padding:2px 8px;border-radius:10px;
    margin-top:6px;
  }

  .task-item-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .task-item-row label{flex:1;}
  .edit-task-btn{
    flex-shrink:0;background:none;border:none;color:var(--text-secondary);
    cursor:pointer;padding:2px;border-radius:4px;display:flex;align-items:center;justify-content:center;
  }
  .edit-task-btn:hover{color:var(--accent);background:var(--card-alt);}
  .edit-task-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}

  .day-pills{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
  .day-pill{
    font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
    border:1px solid var(--border);background:var(--card);color:var(--text-secondary);
    cursor:pointer;line-height:1.4;
  }
  .day-pill:hover{border-color:var(--accent);}
  .day-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .purchase-stages{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .stage-pill{
    font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;
    border:1px solid var(--border);background:var(--card);color:var(--text-secondary);
    cursor:pointer;line-height:1.4;
  }
  .stage-pill:hover{border-color:var(--accent);}
  .stage-pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .stage-pill.stage-final.active{background:#1a7a3c;border-color:#1a7a3c;}

  .calendar-section{margin-top:28px;}
  .calendar-section h2{
    font-size:16px;font-weight:700;margin:0 0 12px;color:var(--text);
  }
  .calendar-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .calendar-day{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    min-height:70px;overflow:hidden;
    flex:1 1 140px;
    max-width:220px;
  }
  .calendar-day-head{
    padding:8px 10px;background:var(--card-alt);border-bottom:1px solid var(--border);
    font-size:12px;font-weight:700;color:var(--text);
  }
  .calendar-day-body{padding:6px;display:flex;flex-direction:column;gap:5px;}
  .calendar-chip{
    background:var(--chip-bg);border:1px solid var(--chip-border);border-radius:6px;
    padding:5px 7px;font-size:11.5px;line-height:1.3;color:var(--text);
  }
  .calendar-chip.done{opacity:0.55;text-decoration:line-through;}
  .calendar-chip .chip-context{
    display:block;font-size:9.5px;font-weight:700;color:var(--text-secondary);
    text-transform:uppercase;letter-spacing:0.3px;margin-bottom:2px;
  }
  .calendar-day-empty{padding:10px;font-size:11px;color:var(--text-secondary);text-align:center;}

  @media (max-width: 780px){
    .calendar-day{flex-basis:110px;}
  }

  .empty{
    text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:14px;
  }

  .task-list-empty{
    padding:14px 8px;font-size:13px;color:var(--text-secondary);text-align:center;
  }

  .completed-section{margin-top:28px;}
  .completed-section h2{
    font-size:16px;font-weight:700;margin:0 0 12px;
  }
  .completed-section.collapsible h2{margin:0;}
  .completed-toggle{
    display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:none;
    padding:6px 2px;font:inherit;font-weight:700;color:var(--text);cursor:pointer;text-align:left;
  }
  .completed-toggle:hover{color:var(--accent);}
  .completed-toggle .completed-arrow{font-size:10px;color:var(--text-secondary);transition:transform .15s ease;}
  .completed-section.open .completed-toggle .completed-arrow{transform:rotate(90deg);}
  .completed-toggle .completed-count{
    font-size:11px;font-weight:700;color:var(--text-secondary);background:var(--card-alt);
    border:1px solid var(--border);padding:1px 8px;border-radius:10px;
  }
  .completed-section.collapsible .completed-card{display:none;margin-top:10px;}
  .completed-section.collapsible.open .completed-card{display:block;}
  .completed-card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;
  }
  .completed-card .task-list{padding:6px 8px;}
  .completed-card .task-item label{color:var(--text-secondary);text-decoration:line-through;}
  .completed-empty{
    padding:16px;font-size:13px;color:var(--text-secondary);text-align:center;
    background:var(--card);border:1px solid var(--border);border-radius:10px;
  }

  .future-block{border-top:1px dashed var(--border);margin:0 8px;}
  .future-toggle{
    width:100%;display:flex;align-items:center;gap:6px;background:transparent;border:none;
    padding:9px 4px;font-size:12px;font-weight:700;color:var(--text-secondary);cursor:pointer;text-align:left;
  }
  .future-toggle:hover{color:var(--accent);}
  .future-toggle .future-arrow{font-size:9px;transition:transform .15s ease;}
  .future-block.open .future-toggle .future-arrow{transform:rotate(90deg);}
  .future-list{display:none;padding:0 0 6px;}
  .future-block.open .future-list{display:block;}
  .task-item.future label{color:var(--text-secondary);cursor:default;}
  .future-icon{flex-shrink:0;width:16px;height:16px;margin-top:2px;color:var(--text-secondary);display:flex;}
  .future-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
  .release-btn{
    flex-shrink:0;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;cursor:pointer;
    border:1px solid var(--accent);background:transparent;color:var(--accent);
  }
  .release-btn:hover{background:var(--accent);color:#fff;}
  .release-btn:disabled{opacity:0.6;cursor:default;}

  .calendar-legend{
    display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;
  }
  .legend-item{
    display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary);
  }
  .legend-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

  footer{
    padding:16px;text-align:center;font-size:12px;color:var(--text-secondary);
  }

  @media (max-width: 780px){
    .layout{flex-direction:column;}
    .sidebar{
      flex:0 0 auto;width:100%;
      padding:10px 6px;border-bottom:1px solid var(--sidebar-border);
    }
  }

  @media print{
    .sidebar{display:none;}
    .print-btn{display:none;}
    body{background:#fff;}
  }
</style>
</head>

const THEME_STORAGE_KEY = 'conceito-checklist-theme';

function applyTheme(isDark){
  document.body.classList.toggle('theme-dark', isDark);
}

function initTheme(){
  let isDark = false;
  try{
    const saved = localStorage.getItem(THEME_STORAGE_KEY);
    if (saved === 'dark') isDark = true;
    else if (saved === 'light') isDark = false;
    else if (window.matchMedia) isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  }catch(e){
    // localStorage indisponível — segue com o tema claro padrão
  }
  applyTheme(isDark);
}

document.getElementById('theme-toggle-btn').addEventListener('click', () => {
  const isDark = !document.body.classList.contains('theme-dark');
  applyTheme(isDark);
  try{ localStorage.setItem(THEME_STORAGE_KEY, isDark ? 'dark' : 'light'); }catch(e){
    // preferência não pôde ser salva; o tema ainda funciona nesta sessão
  }
});

// dados originais levantados (sala -> funcionario -> [tarefas])
const BASE_SEED = {};

function mergeSeed(base, custom, hidden, customSalas){
  hidden = hidden || {};
  const result = {};
  Object.keys(base).forEach(sala => {
    result[sala] = {};
    Object.keys(base[sala]).forEach(func => {
      const kept = base[sala][func].filter(entry => {
        const text = Array.isArray(entry) ? entry[0] : entry;
        return !hidden[taskKey(func, sala, text)];
      });
      if (kept.length) result[sala][func] = kept.slice();
    });
  });
  Object.keys(custom || {}).forEach(sala => {
    if (!result[sala]) result[sala] = {};
    Object.keys(custom[sala]).forEach(func => {
      if (!result[sala][func]) result[sala][func] = [];
      result[sala][func] = result[sala][func].concat(custom[sala][func]);
    });
  });
  // salas criadas sem nenhuma tarefa ainda ficariam com um objeto vazio no
  // customSeed — e o Firebase apaga objetos vazios ao salvar. customSalas
  // (um registro tipo {nome: true}, que nunca fica vazio de verdade
  // enquanto existir alguma sala) garante que elas continuem aparecendo
  // mesmo sem nenhuma tarefa cadastrada.
  Object.keys(customSalas || {}).forEach(sala => {
    if (!result[sala]) result[sala] = {};
  });
  return result;
}

function colorForEmployee(name){
  let hash = 0;
  for (let i = 0; i < name.length; i++){
    hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
  }
  return EMPLOYEE_COLORS[hash % EMPLOYEE_COLORS.length];
}

function hexToRgba(hex, alpha){
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Cada tarefa no SEED pode ser:
// - uma string simples: tarefa normal, começa desmarcada e sem dia definido
// - um par [texto, true]: tarefa "resolvida/histórica" (some do levantamento
//   atual mas continua aparecendo riscada, já marcada por padrão)
// - um trio [texto, doneBool, ["seg","qua",...]]: além do estado, já vem com
//   os dias da semana pré-marcados (informados junto com o levantamento)
function taskInfo(entry){
  if (Array.isArray(entry)){
    return {
      text: entry[0],
      defaultDone: !!entry[1],
      defaultDays: Array.isArray(entry[2]) ? entry[2] : []
    };
  }
  return { text: entry, defaultDone: false, defaultDays: [] };
}

function taskKey(func, sala, text){
  return `${func}|${sala}|${text}`;
}

function allTaskEntries(seed){
  const entries = [];
  for (const sala of Object.keys(seed)){
    for (const func of Object.keys(seed[sala])){
      seed[sala][func].forEach(raw => {
        const { text, defaultDone, defaultDays } = taskInfo(raw);
        entries.push({ key: taskKey(func, sala, text), defaultDone, defaultDays });
      });
    }
  }
  return entries;
}

function withTimeout(promise, ms, label){
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      reject({ code: 'timeout', message: `Tempo esgotado esperando "${label}" (${ms/1000}s)` });
    }, ms);
    promise.then(
      (val) => { clearTimeout(timer); resolve(val); },
      (err) => { clearTimeout(timer); reject(err); }
    );
  });
}

/**
 * O Firebase Realtime Database proíbe ".", "#", "$", "[" e "]" em nomes de
 * chave — e o texto das nossas tarefas usa pontuação normal (frases
 * terminando em ".", por exemplo), então as chaves compostas
 * "func|sala|texto" quebrariam a gravação inteira sem essa camada. Só as
 * chaves de objetos "dicionário" (done, schedule, hiddenTasks, archived,
 * e os dois níveis de customSeed) passam por isso — o resto do app nunca
 * vê essa codificação, ela existe só na fronteira com o Firebase.
 */
function fbEncodeKeyPart(key){
  return btoa(unescape(encodeURIComponent(String(key))))
    .replace(/\+/g, '-')
    .replace(/\//g, '_')
    .replace(/=+$/, '');
}
function fbDecodeKeyPart(encoded){
  let b64 = String(encoded).replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  return decodeURIComponent(escape(atob(b64)));
}
function encodeKeyedMapForFirebase(map){
  if (!map) return map;
  const out = {};
  Object.keys(map).forEach(k => { out[fbEncodeKeyPart(k)] = map[k]; });
  return out;
}
function decodeKeyedMapFromFirebase(map){
  if (!map) return map;
  const out = {};
  Object.keys(map).forEach(k => { out[fbDecodeKeyPart(k)] = map[k]; });
  return out;
}
/**
 * O schedule precisa de uma codificação própria: se todos os dias de uma
 * tarefa forem desmarcados, o valor vira um array vazio — e o Firebase
 * trata array/objeto vazio como "nada aqui", apagando o campo de verdade.
 * Ao recarregar, isso faz o app cair de volta no dia padrão original. Pra
 * evitar isso, guardamos cada dia como true/false explícito (um objeto que
 * nunca fica vazio de verdade), em vez de um array que pode ficar vazio.
 */
function encodeScheduleForFirebase(scheduleMap){
  if (!scheduleMap) return scheduleMap;
  const out = {};
  Object.keys(scheduleMap).forEach(k => {
    const daysArr = Array.isArray(scheduleMap[k]) ? scheduleMap[k] : [];
    const dayObj = {};
    DAYS.forEach(({ code }) => { dayObj[code] = daysArr.includes(code); });
    out[fbEncodeKeyPart(k)] = dayObj;
  });
  return out;
}
function decodeScheduleFromFirebase(scheduleMap){
  if (!scheduleMap) return scheduleMap;
  const out = {};
  Object.keys(scheduleMap).forEach(encKey => {
    const key = fbDecodeKeyPart(encKey);
    const dayObj = scheduleMap[encKey] || {};
    out[key] = DAYS.filter(({ code }) => dayObj[code] === true).map(({ code }) => code);
  });
  return out;
}
function encodeCustomSeedForFirebase(customSeed){
  if (!customSeed) return customSeed;
  const out = {};
  Object.keys(customSeed).forEach(sala => {
    const encSala = fbEncodeKeyPart(sala);
    out[encSala] = {};
    Object.keys(customSeed[sala]).forEach(func => {
      out[encSala][fbEncodeKeyPart(func)] = customSeed[sala][func];
    });
  });
  return out;
}
function decodeCustomSeedFromFirebase(customSeed){
  if (!customSeed) return customSeed;
  const out = {};
  Object.keys(customSeed).forEach(encSala => {
    const sala = fbDecodeKeyPart(encSala);
    out[sala] = {};
    Object.keys(customSeed[encSala]).forEach(encFunc => {
      out[sala][fbDecodeKeyPart(encFunc)] = customSeed[encSala][encFunc];
    });
  });
  return out;
}

    };

    return;
  }
  throw new Error('Nenhum backend de armazenamento disponível nesta visualização.');

/**
 * Cópias de segurança automáticas (só no Firebase). Copia o nó atual, do jeito
 * que está salvo, para backups/<chave>/<rótulo>. Nunca sobrescreve um backup
 * que já existe com o mesmo rótulo e nunca bloqueia o app se falhar.
 */
async function fbBackupOnce(label){
  const fbDb = getFirebaseDb();
  if (!fbDb) return false;
  try{
    const dest = fbDb.ref('backups/' + STORAGE_KEY + '/' + label);
    const existing = await withTimeout(dest.once('value'), 12000, 'Firebase: checar backup');
    if (existing.val()) return false;
    const snap = await withTimeout(fbDb.ref('state/' + STORAGE_KEY).once('value'), 12000, 'Firebase: ler p/ backup');
    const raw = snap.val();
    if (!raw) return false;
    await withTimeout(dest.set(raw), 12000, 'Firebase: gravar backup');
    return true;
  }catch(e){
    console.warn('Backup automático falhou', e);
    return false;
  }
}

async function loadState(){
  let storedDone = {};
  let storedSchedule = {};
  let storedCustomSeed = {};
  let storedArchived = {};
  let storedHiddenTasks = {};
  let storedPurchaseStatus = {};
  let storedCustomSalas = {};
  let storedProjectLinks = {};
  let storedMaterialDependency = {};
  let storedPriority = {};
  let storedFuture = {};
  let storedBaseTemplate = [];
  let storedProjectDocs = {};
  let storedOrphanDone = {};
  let storedOrphanSchedule = {};
  let storedAppVersion = null;
  let hadStoredData = false;
  let storedSubitems = {};
  let lastUpdated = null;

  try{
    const parsed = await loadStoredPayload();
    if (parsed && parsed.done) storedDone = parsed.done;
    if (parsed && parsed.schedule) storedSchedule = parsed.schedule;
    // customSeed/archived/hiddenTasks/purchaseStatus/customSalas/projectLinks/
    // materialDependency são clonados (em vez de usados por referência
    // direta) porque o objeto que volta do banco pode não ser editável —
    // mutar ele direto falha em silêncio ou lança erro.
    if (parsed && parsed.customSeed) storedCustomSeed = JSON.parse(JSON.stringify(parsed.customSeed));
    if (parsed && parsed.archived) storedArchived = JSON.parse(JSON.stringify(parsed.archived));
    if (parsed && parsed.hiddenTasks) storedHiddenTasks = JSON.parse(JSON.stringify(parsed.hiddenTasks));
    if (parsed && parsed.purchaseStatus) storedPurchaseStatus = JSON.parse(JSON.stringify(parsed.purchaseStatus));
    if (parsed && parsed.customSalas) storedCustomSalas = JSON.parse(JSON.stringify(parsed.customSalas));
    if (parsed && parsed.projectLinks) storedProjectLinks = JSON.parse(JSON.stringify(parsed.projectLinks));
    if (parsed && parsed.materialDependency) storedMaterialDependency = JSON.parse(JSON.stringify(parsed.materialDependency));
    if (parsed && parsed.priority) storedPriority = JSON.parse(JSON.stringify(parsed.priority));
    if (parsed && parsed.future) storedFuture = JSON.parse(JSON.stringify(parsed.future));
    if (parsed && parsed.baseTemplate) storedBaseTemplate = normalizeBaseTemplate(parsed.baseTemplate);
    if (parsed && parsed.projectDocs) storedProjectDocs = normalizeProjectDocs(parsed.projectDocs);
    if (parsed && parsed.orphanDone) storedOrphanDone = JSON.parse(JSON.stringify(parsed.orphanDone));
    if (parsed && parsed.orphanSchedule) storedOrphanSchedule = JSON.parse(JSON.stringify(parsed.orphanSchedule));
    if (parsed && parsed.appVersion) storedAppVersion = parsed.appVersion;
    hadStoredData = !!(parsed && parsed.done && Object.keys(parsed.done).length);
    if (parsed && parsed.subitems){
      const rawSub = JSON.parse(JSON.stringify(parsed.subitems));
      // o Firebase pode devolver listas como objeto {0:..,1:..}; normaliza pra array
      Object.keys(rawSub).forEach(k => {
        const arr = Array.isArray(rawSub[k]) ? rawSub[k] : Object.values(rawSub[k] || {});
        const clean = arr.filter(x => x && typeof x.text === 'string' && x.text.trim())
                         .map(x => ({ text: x.text, done: !!x.done }));
        if (clean.length) storedSubitems[k] = clean;
      });
    }
    if (parsed && parsed.lastUpdated) lastUpdated = parsed.lastUpdated;
  }catch(e){
    // ainda não existe nada salvo para esta obra, segue com storedDone vazio
  }

  // a estrutura "base" vem do checklist mais recente que eu montei; a ela se
  // somam salas/atividades cadastradas por você direto no site (customSeed),
  // que ficam salvas independentemente de qualquer atualização futura que eu
  // fizer no código. Só o progresso (done) e o agendamento (schedule) são
  // recuperados do que já estava salvo, tarefa a tarefa (pela chave
  // func|sala|texto), pra sobreviver a reorganizações sem perder marcações.
  // migração: o antigo "link do projeto (PDF)" único da sala vira o primeiro item
  // da lista de projetos dela (o backup automático guarda o formato antigo).
  Object.keys(storedProjectLinks).forEach(sala => {
    const url = storedProjectLinks[sala];
    if (typeof url !== 'string' || !url) return;
    const list = storedProjectDocs[sala] || [];
    if (!list.some(d => d.url === url)) list.unshift({ name: 'Projeto (PDF)', url });
    storedProjectDocs[sala] = list;
    delete storedProjectLinks[sala];
  });

  const seed = mergeSeed(BASE_SEED, storedCustomSeed, storedHiddenTasks, storedCustomSalas);

  // cópia de segurança ANTES de reescrever qualquer coisa: uma por dia e uma
  // na primeira abertura de cada versão nova da página.
  if (hadStoredData){
    await fbBackupOnce(todayLabel());
    if (storedAppVersion !== APP_VERSION) await fbBackupOnce('antes_da_versao_' + APP_VERSION + '_' + Date.now());
  }

  const done = {};
  const schedule = {};
  const seedKeys = new Set();
  allTaskEntries(seed).forEach(({ key, defaultDone, defaultDays }) => {
    seedKeys.add(key);
    // se a atividade tinha sido "guardada" (saiu da estrutura numa versão anterior)
    // e voltou, recupera o progresso guardado
    const fromStoredDone = storedDone.hasOwnProperty(key) ? storedDone[key]
      : (storedOrphanDone.hasOwnProperty(key) ? storedOrphanDone[key] : undefined);
    done[key] = fromStoredDone !== undefined ? !!fromStoredDone : defaultDone;
    const fromStoredSchedule = Array.isArray(storedSchedule[key]) ? storedSchedule[key]
      : (Array.isArray(storedOrphanSchedule[key]) ? storedOrphanSchedule[key] : null);
    schedule[key] = fromStoredSchedule
      ? fromStoredSchedule.filter(d => DAYS.some(D => D.code === d))
      : (defaultDays || []).filter(d => DAYS.some(D => D.code === d));
  });

  // progresso de atividades que NÃO estão mais na estrutura atual não é
  // descartado: fica guardado à parte (e volta se a atividade voltar).
  const orphanDone = {};
  const orphanSchedule = {};
  [storedOrphanDone, storedDone].forEach(src => {
    Object.keys(src).forEach(k => { if (!seedKeys.has(k)) orphanDone[k] = !!src[k]; });
  });
  [storedOrphanSchedule, storedSchedule].forEach(src => {
    Object.keys(src).forEach(k => { if (!seedKeys.has(k) && Array.isArray(src[k])) orphanSchedule[k] = src[k]; });
  });

  const state = {
    seed, customSeed: storedCustomSeed, archived: storedArchived,
    hiddenTasks: storedHiddenTasks, purchaseStatus: storedPurchaseStatus,
    customSalas: storedCustomSalas, projectLinks: storedProjectLinks,
    materialDependency: storedMaterialDependency,
    priority: storedPriority, future: storedFuture, baseTemplate: storedBaseTemplate, projectDocs: storedProjectDocs, subitems: storedSubitems,
    orphanDone, orphanSchedule,
    done, schedule, lastUpdated
  };
  await saveState(state, false);
  return state;
}
function employeesFromSeed(seed){
  const set = new Set();
  for (const sala of Object.keys(seed)){
    for (const func of Object.keys(seed[sala])){
      if (seed[sala][func].length > 0) set.add(func);
    }
  }
  return Array.from(set).sort((a, b) => a.localeCompare(b, 'pt-BR'));
}

let appState = null;
let activeSection = 'obras'; // 'obras' | 'calendario' | 'prestadores' | 'arquivadas'
let activeEmployee = null;

function isPurchaseTask(text){

}

const PURCHASE_STAGES = [
  { code: 'solicitado', label: 'Solicitado' },
  { code: 'orcado', label: 'Orçado' },
  { code: 'pago', label: 'Pago' },
  { code: 'entregue', label: 'Entregue' }
];

/** Lê o status de compra (Orçado/Pago/Entregue) de uma tarefa. */
function getPurchaseStatus(state, key){
  const s = (state.purchaseStatus && state.purchaseStatus[key]) || {};
  return { solicitado: !!s.solicitado, orcado: !!s.orcado, pago: !!s.pago, entregue: !!s.entregue };
}

/**
 * Muda um estágio específico de uma tarefa de compra. "Entregue" também
 * atualiza state.done — assim toda a lógica que já existe (progresso,
 * calendário, lista de concluídas) continua funcionando sem precisar saber
 * que essa tarefa tem estágios extras.
 */
function setPurchaseStage(state, key, stage, value){
  if (!state.purchaseStatus) state.purchaseStatus = {};
  const current = getPurchaseStatus(state, key);
  current[stage] = value;
  state.purchaseStatus[key] = current;
  if (stage === 'entregue') state.done[key] = value;
}

/**
 * Marca uma tarefa como feita/não feita (usado na lista de concluídas).
 * Pra tarefas de Compras, mantém o estágio "Entregue" sincronizado, pra não
 * ficar com done=false e entregue=true ao mesmo tempo.
 */
function setTaskDone(state, key, doneValue){
  const { func } = parseKey(key);
  if (func === 'Compras'){
    if (!state.purchaseStatus) state.purchaseStatus = {};
    const current = getPurchaseStatus(state, key);
    current.entregue = doneValue;
    state.purchaseStatus[key] = current;
  }
  state.done[key] = doneValue;
}

/**
 * Projetos por sala: lista de { name, url } (links de visualização, ex.: Google Drive).
 * Aparecem no painel "Projetos" à direita da sala.
 */
function normalizeProjectDocs(raw){
  const out = {};
  Object.keys(raw || {}).forEach(sala => {
    const v = raw[sala];
    const arr = Array.isArray(v) ? v : Object.values(v || {});
    const clean = arr.filter(d => d && typeof d.url === 'string' && d.url.trim())
      .map(d => ({ name: String(d.name || '').trim() || 'Projeto', url: d.url.trim() }));
    if (clean.length) out[sala] = clean;
  });
  return out;
}
function getProjectDocs(state, sala){
  return (state.projectDocs && state.projectDocs[sala]) || [];
}
/** Valida e salva (index = null → novo). Retorna mensagem de erro, ou null se deu certo. */
function saveProjectDoc(state, sala, index, name, url){
  const cleanName = String(name || '').trim();
  const cleanUrl = String(url || '').trim();
  if (!cleanName) return 'Digite o nome do projeto.';
  if (!cleanUrl) return 'Cole o link do projeto.';
  if (!/^https?:\/\//i.test(cleanUrl)) return 'Isso não parece um link válido — precisa começar com http:// ou https://.';
  if (!state.projectDocs) state.projectDocs = {};
  const list = getProjectDocs(state, sala).slice();
  const item = { name: cleanName, url: cleanUrl };
  if (index === null || index === undefined || !list[index]) list.push(item); else list[index] = item;
  state.projectDocs[sala] = list;
  return null;
}
function deleteProjectDoc(state, sala, index){
  const list = getProjectDocs(state, sala).slice();
  if (!list[index]) return false;
  list.splice(index, 1);
  if (list.length) state.projectDocs[sala] = list; else delete state.projectDocs[sala];
  return true;
}

/**
 * Checklist base: lista padrão de atividades que pode ser aplicada ao criar
 * uma sala nova. Cada item: { func, text, subitems: [texto], future: bool }.
 */
function normalizeBaseTemplate(raw){
  const arr = Array.isArray(raw) ? raw : Object.values(raw || {});
  return arr
    .filter(it => it && typeof it.text === 'string' && it.text.trim() && typeof it.func === 'string' && it.func.trim())
    .map(it => ({
      func: it.func.trim(),
      text: it.text.trim(),
      subitems: parseSubitemTexts(Array.isArray(it.subitems) ? it.subitems : Object.values(it.subitems || {})),
      future: !!it.future
    }));
}
function getBaseTemplate(state){
  return Array.isArray(state.baseTemplate) ? state.baseTemplate : [];
}
/** Adiciona (index = null) ou altera (index = posição) um item do checklist base. false se duplicado/inválido. */
function saveBaseItem(state, index, func, text, subitemTexts, future){
  const cleanFunc = String(func || '').trim();
  const cleanText = String(text || '').trim();
  if (!cleanFunc || !cleanText) return false;
  const list = getBaseTemplate(state).slice();
  const dup = list.findIndex((it, i) => i !== index && it.func === cleanFunc && it.text === cleanText);
  if (dup !== -1) return false;
  const item = { func: cleanFunc, text: cleanText, subitems: parseSubitemTexts(subitemTexts), future: !!future };
  if (index === null || index === undefined || !list[index]) list.push(item); else list[index] = item;
  state.baseTemplate = list;
  return true;
}
function deleteBaseItem(state, index){
  const list = getBaseTemplate(state).slice();
  if (!list[index]) return false;
  list.splice(index, 1);
  state.baseTemplate = list;
  return true;
}
/** Aplica o checklist base a uma sala (normalmente recém-criada). Retorna quantas atividades entraram. */
function applyBaseTemplate(state, sala){
  let count = 0;
  getBaseTemplate(state).forEach(it => {
    const r = addCustomTask(state, sala, it.func, it.text, [], false, false, it.subitems, it.future);
    if (r) count++;
  });
  return count;
}

/** Cria uma sala nova (vazia) se ainda não existir. Retorna false se já existia. */
function addCustomSala(state, salaName){
  const name = String(salaName || '').trim();
  if (!name || state.seed[name]) return false;
  if (!state.customSalas) state.customSalas = {};
  state.customSalas[name] = true;
  if (!state.customSeed[name]) state.customSeed[name] = {};
  state.seed = mergeSeed(BASE_SEED, state.customSeed, state.hiddenTasks, state.customSalas);
  return true;
}

function archiveSala(state, sala){
  state.archived[sala] = true;
}

function unarchiveSala(state, sala){
  delete state.archived[sala];
}

/** Lê/marca se uma tarefa depende de material (destacada em vermelho na tela). */
function dependsOnMaterial(state, key){
  return !!(state.materialDependency && state.materialDependency[key]);
}
function setDependsOnMaterial(state, key, value){
  if (!state.materialDependency) state.materialDependency = {};
  if (value) state.materialDependency[key] = true;
  else delete state.materialDependency[key];
}

/** Prioridade: atividade marcada como prioritária aparece em negrito. */
function isPriority(state, key){
  return !!(state.priority && state.priority[key]);
}
function setPriority(state, key, value){
  if (!state.priority) state.priority = {};
  if (value) state.priority[key] = true;
  else delete state.priority[key];
}

/**
 * Atividade futura: fica no checklist pra não esquecer, mas ainda não pode ser
 * feita. Não conta no progresso, não entra no calendário e não tem checkbox
 * nem dias — até ser "liberada" (virar atual).
 */
function isFuture(state, key){
  return !!(state.future && state.future[key]);
}
function setFuture(state, key, value){
  if (!state.future) state.future = {};
  if (value){
    state.future[key] = true;
    // futura não fica agendada nem marcada como feita
    delete state.schedule[key];
    state.done[key] = false;
  } else {
    delete state.future[key];
  }
}
/** Chaves que contam no progresso: todas menos as futuras. */
function countableKeys(state){
  return Object.keys(state.done).filter(k => !isFuture(state, k));
}

/** Subitens: lista [{text, done}] ligada à chave da atividade-mãe. */
function getSubitems(state, key){
  return (state.subitems && state.subitems[key]) || [];
}
function parseSubitemTexts(raw){
  const list = Array.isArray(raw) ? raw : String(raw || '').split('\n');
  const seen = new Set();
  const out = [];
  list.forEach(l => {
    const t = String(l).trim();
    if (t && !seen.has(t)){ seen.add(t); out.push(t); }
  });
  return out;
}
/**
 * Define os subitens de uma atividade a partir de uma lista de textos,
 * preservando o "feito" dos que já existiam (casando pelo texto). A atividade-mãe
 * passa a refletir os subitens: concluída só quando todos estão concluídos.
 */
function setSubitems(state, key, texts){
  if (!state.subitems) state.subitems = {};
  const clean = parseSubitemTexts(texts);
  if (clean.length === 0){
    delete state.subitems[key];
    return;
  }
  const previous = {};
  getSubitems(state, key).forEach(sub => { previous[sub.text] = !!sub.done; });
  state.subitems[key] = clean.map(t => ({ text: t, done: !!previous[t] }));
  state.done[key] = state.subitems[key].every(sub => sub.done);
}
function setSubitemDone(state, key, idx, value){
  const list = getSubitems(state, key);
  if (!list[idx]) return;
  list[idx].done = !!value;
  state.done[key] = list.every(sub => sub.done);
}
/** Marcar/desmarcar a atividade-mãe replica o valor em todos os subitens. */
function setTaskDoneWithSubitems(state, key, value){
  const list = getSubitems(state, key);
  list.forEach(sub => { sub.done = !!value; });
  setTaskDone(state, key, value);
}

/**
 * Cadastra uma atividade nova numa sala (existente ou recém-criada).
 * Aplica a regra automática: texto com "Comprar"/"Compra" vai pro
 * funcionário virtual "Compras", independente do responsável escolhido.
 */
function addCustomTask(state, sala, func, text, days, needsMaterial, priority, subitemTexts, future){
  const cleanText = String(text || '').trim();
  if (!cleanText) return null;

  const effectiveFunc = isPurchaseTask(cleanText) ? 'Compras' : (String(func || '').trim() || 'Sem responsável');
  const cleanDays = future ? [] : (Array.isArray(days) ? days.filter(d => DAYS.some(D => D.code === d)) : []);

  if (!state.customSeed[sala]) state.customSeed[sala] = {};
  if (!state.customSeed[sala][effectiveFunc]) state.customSeed[sala][effectiveFunc] = [];
  state.customSeed[sala][effectiveFunc].push(cleanDays.length ? [cleanText, false, cleanDays] : cleanText);

  state.seed = mergeSeed(BASE_SEED, state.customSeed, state.hiddenTasks, state.customSalas);

  const key = taskKey(effectiveFunc, sala, cleanText);
  state.done[key] = false;
  if (cleanDays.length) state.schedule[key] = cleanDays;
  setDependsOnMaterial(state, key, !!needsMaterial);
  setPriority(state, key, !!priority);
  if (effectiveFunc !== 'Compras') setSubitems(state, key, subitemTexts);
  setFuture(state, key, !!future);

  return { func: effectiveFunc, key, redirected: effectiveFunc === 'Compras' && effectiveFunc !== func };
}

/** Remove uma entrada específica do customSeed (usado ao editar/mover uma tarefa cadastrada por você). */
function removeFromCustomSeed(state, sala, func, text){
  if (state.customSeed[sala] && state.customSeed[sala][func]){
    state.customSeed[sala][func] = state.customSeed[sala][func].filter(entry => {
      const t = Array.isArray(entry) ? entry[0] : entry;
      return t !== text;
    });
    if (state.customSeed[sala][func].length === 0) delete state.customSeed[sala][func];
    if (Object.keys(state.customSeed[sala]).length === 0) delete state.customSeed[sala];
  }
}

/**
 * Edita uma atividade já existente (texto, responsável e/ou dias) — seja ela
 * vinda do levantamento original ou cadastrada por você. A tarefa antiga é
 * "escondida" (não é possível mudar o BASE_SEED, que vem do código) e uma
 * nova entrada equivalente entra no customSeed, migrando o progresso (done)
 * e o agendamento (schedule) da chave antiga pra chave nova.
 */
function editTask(state, sala, oldFunc, oldText, newFunc, newText, days, needsMaterial, priority, subitemTexts, future){
  const oldKey = taskKey(oldFunc, sala, oldText);
  const cleanText = String(newText || '').trim();
  if (!cleanText) return null;
  const effectiveFunc = isPurchaseTask(cleanText) ? 'Compras' : (String(newFunc || '').trim() || oldFunc);
  const cleanDays = future ? [] : (Array.isArray(days) ? days.filter(d => DAYS.some(D => D.code === d)) : []);
  const newKey = taskKey(effectiveFunc, sala, cleanText);

  if (!state.hiddenTasks) state.hiddenTasks = {};
  if (!state.purchaseStatus) state.purchaseStatus = {};

  if (oldKey !== newKey){
    state.hiddenTasks[oldKey] = true;
    removeFromCustomSeed(state, sala, oldFunc, oldText);

    if (!state.customSeed[sala]) state.customSeed[sala] = {};
    if (!state.customSeed[sala][effectiveFunc]) state.customSeed[sala][effectiveFunc] = [];
    state.customSeed[sala][effectiveFunc].push(cleanDays.length ? [cleanText, false, cleanDays] : cleanText);

    state.seed = mergeSeed(BASE_SEED, state.customSeed, state.hiddenTasks, state.customSalas);

    state.done[newKey] = !!state.done[oldKey];
    delete state.done[oldKey];
    delete state.schedule[oldKey];
    if (cleanDays.length) state.schedule[newKey] = cleanDays; else delete state.schedule[newKey];

    // migra o status de compra (Orçado/Pago/Entregue) da chave antiga pra nova
    if (state.purchaseStatus[oldKey]){
      state.purchaseStatus[newKey] = state.purchaseStatus[oldKey];
      delete state.purchaseStatus[oldKey];
    }
    if (effectiveFunc !== 'Compras'){
      delete state.purchaseStatus[newKey];
    }

    setDependsOnMaterial(state, oldKey, false);
    setPriority(state, oldKey, false);
    if (state.future) delete state.future[oldKey];
    if (state.subitems){
      if (state.subitems[oldKey]) state.subitems[newKey] = state.subitems[oldKey];
      delete state.subitems[oldKey];
    }
  } else if (cleanDays.length){
    state.schedule[newKey] = cleanDays;
  } else {
    delete state.schedule[newKey];
  }

  setDependsOnMaterial(state, newKey, !!needsMaterial);
  setPriority(state, newKey, !!priority);
  // subitens: só pra quem não é Compras; undefined = não mexe nos existentes
  if (effectiveFunc === 'Compras'){
    if (state.subitems) delete state.subitems[newKey];
  } else if (subitemTexts !== undefined){
    setSubitems(state, newKey, subitemTexts);
  }
  // undefined = mantém como estava (atual/futura)
  if (future !== undefined) setFuture(state, newKey, !!future);

  return { func: effectiveFunc, key: newKey };
}

/**
 * Apaga uma atividade por completo — funciona tanto pra tarefas do
 * levantamento original (BASE_SEED, que a gente não pode editar de verdade,
 * então só "esconde") quanto pra tarefas cadastradas por você (customSeed,
 * removida de fato). Limpa também o progresso, o agendamento, o status de
 * compra e a dependência de material dela.
 */
function deleteTask(state, sala, func, text){
  const key = taskKey(func, sala, text);
  if (!state.hiddenTasks) state.hiddenTasks = {};
  state.hiddenTasks[key] = true;
  removeFromCustomSeed(state, sala, func, text);
  state.seed = mergeSeed(BASE_SEED, state.customSeed, state.hiddenTasks, state.customSalas);
  delete state.done[key];
  delete state.schedule[key];
  if (state.purchaseStatus) delete state.purchaseStatus[key];
  setDependsOnMaterial(state, key, false);
  setPriority(state, key, false);
  if (state.future) delete state.future[key];
  if (state.subitems) delete state.subitems[key];
  return { key };
}

async function saveState(state, updateStamp = true){
  const stampBackup = state.lastUpdated;
  if (updateStamp) state.lastUpdated = new Date().toISOString();
  const payload = buildPayload(state);
  try{
    await writeStoredPayload(payload);
    renderFooter(state);
    updateDiag({ lastAction: 'gravação OK em ' + new Date().toLocaleTimeString('pt-BR'), lastError: '' });
    return true;
  }catch(e){
    console.error('Falha ao salvar checklist', e);
    state.lastUpdated = stampBackup;
    renderFooter(state);
    updateDiag({ lastAction: 'FALHA na gravação em ' + new Date().toLocaleTimeString('pt-BR'), lastError: (e && (e.code || e.message)) || String(e) });
    return false;
  }
}

function formatStamp(iso){
  if (!iso) return 'ainda não salvo';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function renderFooter(state){
  const el = document.getElementById('footer');
  if (el) el.textContent = 'Última atualização: ' + formatStamp(state.lastUpdated);
  renderBackupBar();
}

/** Botões de backup manual: baixar uma cópia (.json) e restaurar a partir de uma. */
function renderBackupBar(){
  const bar = document.getElementById('backup-bar');
  if (!bar || bar.dataset.ready || isQuickAddMode) return;
  bar.dataset.ready = '1';
  bar.innerHTML = `
    <button type="button" class="modal-btn modal-btn-cancel" id="btn-backup-download">⬇ Baixar backup</button>
    <button type="button" class="modal-btn modal-btn-cancel" id="btn-backup-restore">⬆ Restaurar backup</button>
    <input type="file" id="backup-file" accept="application/json,.json" style="display:none;" />
  `;
  document.getElementById('btn-backup-download').onclick = () => {
    if (!appState) return;
    const blob = new Blob([JSON.stringify(buildPayload(appState), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    a.href = url;
    a.download = `backup_checklist_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  };
  const fileInput = document.getElementById('backup-file');
  document.getElementById('btn-backup-restore').onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    try{
      const parsed = JSON.parse(await file.text());
      if (!parsed || typeof parsed.done !== 'object' || typeof parsed.schedule !== 'object') throw new Error('arquivo inválido');
      if (!confirm('Restaurar este backup vai SUBSTITUIR os dados atuais do checklist (antes disso uma cópia dos dados atuais é guardada). Continuar?')) return;
      await fbBackupOnce('antes_de_restaurar_' + Date.now());
      await writeStoredPayload(parsed);
      window.location.reload();
    }catch(e){
      alert('Não foi possível restaurar: ' + ((e && e.message) || e));
    }
  };
}

function parseKey(key){
  const [func, sala, ...rest] = key.split('|');
  return { func, sala, text: rest.join('|') };
}

function overallCounts(state){
  const keys = countableKeys(state);
  const total = keys.length;
  const done = keys.filter(k => state.done[k]).length;
  return { done, total };
}

function employeeCounts(state, employee){
  const keys = countableKeys(state).filter(k => {
    const p = parseKey(k);
    return p.func === employee && !state.archived[p.sala];
  });
  const total = keys.length;
  const done = keys.filter(k => state.done[k]).length;
  return { done, total };
}

function salaCounts(state, sala){
  const keys = countableKeys(state).filter(k => parseKey(k).sala === sala);
  const total = keys.length;
  const done = keys.filter(k => state.done[k]).length;
  return { done, total };
}

function renderHeaderProgress(state){
  const { done, total } = overallCounts(state);
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('overall-pct').textContent = `${done}/${total} — ${pct}%`;
  document.getElementById('overall-fill').style.width = pct + '%';
}

function renderNav(state){

/**
 * Monta um <li> de tarefa completo: checkbox, texto (com contexto opcional,
 * usado nas visões agregadas), botão de editar e os pills de dia. Usada por
 * renderGroupCard e renderGeralCard pra não duplicar essa lógica.
 */
function renderTaskItem(state, func, sala, text, opts){
  opts = opts || {};
  const key = taskKey(func, sala, text);
  const isCompra = func === 'Compras';
  const needsMaterial = dependsOnMaterial(state, key);
  const li = document.createElement('li');
  const priorityOn = isPriority(state, key);
  const subs = isCompra ? [] : getSubitems(state, key);
  li.className = 'task-item' + (needsMaterial ? ' needs-material' : '') + (priorityOn ? ' priority' : '');
  const inputId = 'chk_' + key.replace(/[^a-zA-Z0-9]/g, '_');
  const contextHtml = opts.showContext ? `<span class="chip-context" style="display:block;">${func}</span>` : '';
  const materialBadgeHtml = needsMaterial ? '<span class="material-badge">🧱 Depende de material</span>' : '';
  li.innerHTML = `
    ${isCompra ? '' : `<input type="checkbox" id="${inputId}" />`}
    <div class="task-item-body">
      <div class="task-item-row">
        <label${isCompra ? '' : ` for="${inputId}"`}>${contextHtml}${text}</label>
        <button type="button" class="edit-task-btn no-capture" title="Editar atividade">${EDIT_ICON_SVG}</button>
      </div>
      ${materialBadgeHtml}
      ${subs.length ? `<span class="subitem-count">${subs.filter(x => x.done).length}/${subs.length} subitens</span>` : ''}
      ${subs.length ? '<ul class="subitem-list"></ul>' : ''}
      ${isCompra ? '<div class="purchase-stages"></div>' : '<div class="day-pills"></div>'}
    </div>
  `;

  if (isCompra){
    const stagesEl = li.querySelector('.purchase-stages');
    const status = getPurchaseStatus(state, key);
    PURCHASE_STAGES.forEach(({ code, label }) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'stage-pill' + (status[code] ? ' active' : '') + (code === 'entregue' ? ' stage-final' : '');
      btn.textContent = label;
      btn.addEventListener('click', async () => {
        setPurchaseStage(state, key, code, !status[code]);
        await saveState(state);
        render();
      });
      stagesEl.appendChild(btn);
    });
  } else {
    const checkbox = li.querySelector('input');
    checkbox.addEventListener('change', async () => {
      setTaskDoneWithSubitems(state, key, checkbox.checked);
      await saveState(state);
      render();
    });

    const subListEl = li.querySelector('.subitem-list');
    if (subListEl){
      subs.forEach((sub, idx) => {
        const subLi = document.createElement('li');
        subLi.className = sub.done ? 'sub-done' : '';
        const subId = inputId + '_sub' + idx;
        subLi.innerHTML = `<input type="checkbox" id="${subId}"${sub.done ? ' checked' : ''} /><label for="${subId}">${sub.text}</label>`;
        subLi.querySelector('input').addEventListener('change', async (ev) => {
          setSubitemDone(state, key, idx, ev.target.checked);
          await saveState(state);
          render();
        });
        subListEl.appendChild(subLi);
      });
    }

    const pillsEl = li.querySelector('.day-pills');
    const scheduled = state.schedule[key] || [];
    DAYS.forEach(({ code, label }) => {
      const pill = document.createElement('button');
      pill.type = 'button';
      pill.className = 'day-pill' + (scheduled.includes(code) ? ' active' : '');
      pill.textContent = label;
      pill.title = `Agendar para ${label}`;
      pill.addEventListener('click', async () => {
        const current = state.schedule[key] || [];
        state.schedule[key] = current.includes(code)
          ? current.filter(d => d !== code)
          : [...current, code];
        await saveState(state);
        render();
      });
      pillsEl.appendChild(pill);
    });
  }

  li.querySelector('.edit-task-btn').addEventListener('click', () => {
    showEditTaskModal(sala, func, text);
  });

  return li;
}

 * <li> de uma atividade futura: sem checkbox, sem dias e sem estágios de
 * compra — só o texto, os destaques (material/prioridade), o botão "Liberar"
 * (vira atual) e o lápis de editar.
 */
function renderFutureItem(state, func, sala, text, opts){
  opts = opts || {};
  const key = taskKey(func, sala, text);
  const needsMaterial = dependsOnMaterial(state, key);
  const subs = func === 'Compras' ? [] : getSubitems(state, key);
  const li = document.createElement('li');
