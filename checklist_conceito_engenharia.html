  const contextHtml = opts.showContext ? `<span class="chip-context" style="display:block;">${func}</span>` : '';
  li.innerHTML = `
    <span class="future-icon" title="Atividade futura">${CLOCK_ICON_SVG}</span>
    <div class="task-item-body">
      <div class="task-item-row">
        <label>${contextHtml}${text}</label>
        <button type="button" class="release-btn" title="Passar para atividade atual">Liberar</button>
        <button type="button" class="edit-task-btn" title="Editar atividade">${EDIT_ICON_SVG}</button>
      </div>
      ${needsMaterial ? '<span class="material-badge">🧱 Depende de material</span>' : ''}
      ${subs.length ? `<span class="subitem-count">${subs.length} subitens</span>` : ''}
    </div>
  `;

  const releaseBtn = li.querySelector('.release-btn');
  releaseBtn.addEventListener('click', async () => {
    releaseBtn.textContent = 'Liberando...';
    releaseBtn.disabled = true;
    setFuture(state, key, false);
    const ok = await saveState(state);
    if (!ok){
      setFuture(state, key, true);
      releaseBtn.textContent = 'Liberar';
      releaseBtn.disabled = false;
      alert('Não foi possível salvar agora. Tente novamente em instantes.');
      return;
    }
    render();
  });

  li.querySelector('.edit-task-btn').addEventListener('click', () => {
    showEditTaskModal(sala, func, text);
  });

  return li;
}

// quais blocos "Futuras" estão abertos (sobrevive aos re-renders; começa fechado)
const openFutureBlocks = new Set();

/**
 * Bloco recolhível "▸ Futuras (n)" no fim de um card. Fica fora da imagem
 * baixada (no-capture), que mostra só as atividades atuais.
 */
function renderFutureBlock(blockId, items){
  const block = document.createElement('div');
  block.className = 'future-block no-capture' + (openFutureBlocks.has(blockId) ? ' open' : '');
  block.dataset.blockId = blockId;

  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'future-toggle';
  toggle.innerHTML = `<span class="future-arrow">▶</span>Futuras (${items.length})`;
  toggle.addEventListener('click', () => {
    const nowOpen = !block.classList.contains('open');
    block.classList.toggle('open', nowOpen);
    if (nowOpen) openFutureBlocks.add(blockId); else openFutureBlocks.delete(blockId);
    refreshFutureToggleAll();
  });
  block.appendChild(toggle);

  const list = document.createElement('ul');
  list.className = 'task-list future-list';
  items.forEach(li => list.appendChild(li));
  block.appendChild(list);
  return block;
}

function renderGroupCard(state, groupTitle, rawTasks, func, sala){
  const card = document.createElement('div');
  card.className = 'sala-card';

  const tasks = rawTasks.map(taskInfo);
  const currentTasks = tasks.filter(t => !isFuture(state, taskKey(func, sala, t.text)));
  const futureTasks = tasks.filter(t => isFuture(state, taskKey(func, sala, t.text)));
  const groupDone = currentTasks.filter(t => state.done[taskKey(func, sala, t.text)]).length;
  const activeTasks = currentTasks.filter(t => !state.done[taskKey(func, sala, t.text)]);

  const head = document.createElement('div');
  head.className = 'sala-head';
  head.innerHTML = `<h3>${groupTitle}</h3><span class="sala-count">${groupDone}/${currentTasks.length}</span>`;
  card.appendChild(head);

  const list = document.createElement('ul');
  list.className = 'task-list';

  if (activeTasks.length === 0){
    list.innerHTML = futureTasks.length
      ? '<li class="task-list-empty">Nenhuma atividade atual pendente.</li>'
      : '<li class="task-list-empty">Tudo concluído por aqui 🎉</li>';
  }

  activeTasks.forEach(({ text }) => {
    list.appendChild(renderTaskItem(state, func, sala, text));
  });

  card.appendChild(list);

  if (futureTasks.length){
    card.appendChild(renderFutureBlock(
      'grp|' + func + '|' + sala,
      futureTasks.map(({ text }) => renderFutureItem(state, func, sala, text))
    ));
  }
  return card;
}

function collectScheduledTasks(state, filterFn){
  const results = [];
  for (const sala of Object.keys(state.seed)){
    for (const func of Object.keys(state.seed[sala])){
      if (func === 'Compras') continue; // Compras usa estágios (Orçado/Pago/Entregue), não dias da semana
      if (!filterFn(func, sala)) continue;
      state.seed[sala][func].map(taskInfo).forEach(({ text }) => {
        const key = taskKey(func, sala, text);
        const days = state.schedule[key] || [];
        const isDone = !!state.done[key];
        // tarefas concluídas saem do calendário (ficam só na lista de concluídas);
        // futuras também ficam fora até serem liberadas
        if (days.length > 0 && !isDone && !isFuture(state, key)){
          results.push({ func, sala, text, key, days, done: isDone, needsMaterial: dependsOnMaterial(state, key), priority: isPriority(state, key) });
        }
      });
    }
  }
  return results;
}

function renderWeekCalendar(state, title, filterFn, contextLabelFn){
  const section = document.createElement('div');
  section.className = 'calendar-section';

  const heading = document.createElement('h2');
  heading.textContent = title;
  section.appendChild(heading);

  const tasks = collectScheduledTasks(state, filterFn);

  const distinctEmployees = Array.from(new Set(tasks.map(t => t.func))).sort((a, b) => a.localeCompare(b, 'pt-BR'));
  if (distinctEmployees.length > 1){
    const legend = document.createElement('div');
    legend.className = 'calendar-legend';
    distinctEmployees.forEach(emp => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-swatch" style="background:${colorForEmployee(emp)}"></span>${emp}`;
      legend.appendChild(item);
    });
    section.appendChild(legend);
  }

  const grid = document.createElement('div');
  grid.className = 'calendar-grid';

  DAYS.forEach(({ code, label }) => {
    const dayEl = document.createElement('div');
    dayEl.className = 'calendar-day';

    const head = document.createElement('div');
    head.className = 'calendar-day-head';
    head.textContent = label;
    dayEl.appendChild(head);

    const body = document.createElement('div');
    body.className = 'calendar-day-body';

    const dayTasks = tasks.filter(t => t.days.includes(code));
    if (dayTasks.length === 0){
      body.innerHTML = '<div class="calendar-day-empty">—</div>';
    } else {
      dayTasks.forEach(t => {
        const color = t.needsMaterial ? '#DC2626' : colorForEmployee(t.func);
        const chip = document.createElement('div');
        chip.className = 'calendar-chip' + (t.done ? ' done' : '') + (t.needsMaterial ? ' needs-material' : '') + (t.priority ? ' priority' : '');
        chip.style.borderLeft = `4px solid ${color}`;
        chip.style.background = hexToRgba(color, t.needsMaterial ? 0.14 : 0.1);
        const ctx = contextLabelFn ? contextLabelFn(t) : '';
        const materialTag = t.needsMaterial ? '<span class="material-badge" style="margin-top:4px;">🧱 Material</span>' : '';
        chip.innerHTML = (ctx ? `<span class="chip-context" style="color:${color}">${ctx}</span>` : '') + t.text + materialTag;
        body.appendChild(chip);
      });
    }

    dayEl.appendChild(body);
    grid.appendChild(dayEl);
  });

  section.appendChild(grid);
  return section;
}

/**
 * Quadro de compras em andamento — mesma formatação visual do calendário
 * semanal, mas as "colunas" são os estágios (Solicitado/Orçado/Pago) em vez
 * de dias da semana, e cada sala tem sua própria cor. Uma compra aparece na
 * coluna do estágio mais avançado que já foi marcado; some do quadro assim
 * que "Entregue" é marcado (aí ela já está na lista de concluídas).
 */
function renderPurchaseBoard(state){
  const section = document.createElement('div');
  section.className = 'calendar-section';

  const heading = document.createElement('h2');
  heading.textContent = 'Compras em andamento';
  section.appendChild(heading);

  const columns = [
    { code: 'solicitado', label: 'Solicitado' },
    { code: 'orcado', label: 'Orçado' },
    { code: 'pago', label: 'Pago' }
  ];
  const grouped = { solicitado: [], orcado: [], pago: [] };

  Object.keys(state.seed).forEach(sala => {
    if (state.archived[sala]) return;
    const tasks = (state.seed[sala] && state.seed[sala]['Compras']) || [];
    tasks.map(taskInfo).forEach(({ text }) => {
      const key = taskKey('Compras', sala, text);
      if (state.done[key]) return; // já entregue — fica só na lista de concluídas
      if (isFuture(state, key)) return; // compra futura — ainda não entrou no fluxo
      const status = getPurchaseStatus(state, key);
      const col = status.pago ? 'pago' : (status.orcado ? 'orcado' : 'solicitado');
      grouped[col].push({ sala, text, priority: isPriority(state, key) });
    });
  });

  const distinctSalas = Array.from(new Set(columns.flatMap(c => grouped[c.code].map(t => t.sala))))
    .sort((a, b) => a.localeCompare(b, 'pt-BR'));
  if (distinctSalas.length > 1){
    const legend = document.createElement('div');
    legend.className = 'calendar-legend';
    distinctSalas.forEach(sala => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-swatch" style="background:${colorForEmployee(sala)}"></span>${sala}`;
      legend.appendChild(item);
    });
    section.appendChild(legend);
  }

  const grid = document.createElement('div');
  grid.className = 'calendar-grid';

  columns.forEach(({ code, label }) => {
    const colEl = document.createElement('div');
    colEl.className = 'calendar-day';

    const head = document.createElement('div');
    head.className = 'calendar-day-head';
    head.textContent = label;
    colEl.appendChild(head);

    const body = document.createElement('div');
    body.className = 'calendar-day-body';

    const items = grouped[code];
    if (items.length === 0){
      body.innerHTML = '<div class="calendar-day-empty">—</div>';
    } else {
      items.forEach(({ sala, text, priority }) => {
        const color = colorForEmployee(sala);
        const chip = document.createElement('div');
        chip.className = 'calendar-chip' + (priority ? ' priority' : '');
        chip.style.borderLeft = `4px solid ${color}`;
        chip.style.background = hexToRgba(color, 0.1);
        chip.innerHTML = `<span class="chip-context" style="color:${color}">${sala}</span>${text}`;
        body.appendChild(chip);
      });
    }

    colEl.appendChild(body);
    grid.appendChild(colEl);
  });

  section.appendChild(grid);
  return section;
}

function collectDoneTasks(state, filterFn){
  const results = [];
  for (const sala of Object.keys(state.seed)){
    for (const func of Object.keys(state.seed[sala])){
      if (!filterFn(func, sala)) continue;
      state.seed[sala][func].map(taskInfo).forEach(({ text }) => {
        const key = taskKey(func, sala, text);
        if (state.done[key] && !isFuture(state, key)) results.push({ func, sala, text, key });
      });
    }
  }
  return results;
}

// quais listas de concluídas estão abertas (sobrevive aos re-renders; começa recolhida)
const openCompletedSections = new Set();

function renderCompletedList(state, title, filterFn, contextLabelFn){
  const section = document.createElement('div');
  section.className = 'completed-section no-capture';

  const heading = document.createElement('h2');
  heading.textContent = title;
  section.appendChild(heading);

  const doneTasks = collectDoneTasks(state, filterFn);

  if (doneTasks.length === 0){
    const empty = document.createElement('div');
    empty.className = 'completed-empty';
    empty.textContent = 'Nenhuma tarefa concluída ainda.';
    section.appendChild(empty);
    return section;
  }

  // lista recolhida por padrão: clicar no título abre/fecha
  section.classList.add('collapsible');
  if (openCompletedSections.has(title)) section.classList.add('open');
  heading.textContent = '';
  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'completed-toggle';
  toggle.setAttribute('aria-expanded', section.classList.contains('open') ? 'true' : 'false');
  toggle.innerHTML = `<span class="completed-arrow">▶</span><span class="completed-title"></span><span class="completed-count">${doneTasks.length}</span>`;
  toggle.querySelector('.completed-title').textContent = title;
  toggle.addEventListener('click', () => {
    const nowOpen = !section.classList.contains('open');
    section.classList.toggle('open', nowOpen);
    toggle.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
    if (nowOpen) openCompletedSections.add(title); else openCompletedSections.delete(title);
  });
  heading.appendChild(toggle);

  const card = document.createElement('div');
  card.className = 'completed-card';
  const list = document.createElement('ul');
  list.className = 'task-list';

  doneTasks.forEach(({ func, sala, text, key }) => {
    const isCompra = func === 'Compras';
    const li = document.createElement('li');
    const doneSubs = isCompra ? [] : getSubitems(state, key);
    li.className = 'task-item done' + (isPriority(state, key) ? ' priority' : '');
    const inputId = 'chk_done_' + key.replace(/[^a-zA-Z0-9]/g, '_');
    const ctx = contextLabelFn ? contextLabelFn({ func, sala }) : '';
    li.innerHTML = `
      ${isCompra ? '' : `<input type="checkbox" id="${inputId}" checked />`}
      <div class="task-item-body">
        <label${isCompra ? '' : ` for="${inputId}"`}>${ctx ? `<span class="chip-context" style="display:block;">${ctx}</span>` : ''}${text}</label>
        ${doneSubs.length ? `<ul class="subitem-list">${doneSubs.map(sub => `<li class="sub-done"><label>${sub.text}</label></li>`).join('')}</ul>` : ''}
        ${isCompra ? '<div class="purchase-stages"></div>' : ''}
      </div>
    `;
    if (isCompra){
      const stagesEl = li.querySelector('.purchase-stages');
      const status = getPurchaseStatus(state, key);
      PURCHASE_STAGES.forEach(({ code, label }) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'stage-pill' + (status[code] ? ' active' : '') + (code === 'entregue' ? ' stage-final' : '');
        btn.textContent = label;
        btn.addEventListener('click', async () => {
          setPurchaseStage(state, key, code, !status[code]);
          await saveState(state);
          render();
        });
        stagesEl.appendChild(btn);
      });
    } else {
      const checkbox = li.querySelector('input');
      checkbox.addEventListener('change', async () => {
        setTaskDoneWithSubitems(state, key, checkbox.checked);
        await saveState(state);
        render();
      });
    }
    list.appendChild(li);
  });

  card.appendChild(list);
  section.appendChild(card);
  return section;
}

function renderSalaDetail(state, sala, isArchivedView){
  const contentEl = document.getElementById('content');

  const { done, total } = salaCounts(state, sala);
  const pct = total ? Math.round((done/total)*100) : 0;

  const nameEl = document.createElement('div');
  nameEl.className = 'employee-name';
  nameEl.textContent = sala;
  contentEl.appendChild(nameEl);

  const progressEl = document.createElement('div');
  progressEl.className = 'employee-progress';
  progressEl.innerHTML = `
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="pct">${done}/${total} tarefas</div>
  `;
  contentEl.appendChild(progressEl);

  const actionsRow = document.createElement('div');
  actionsRow.className = 'sala-actions-row no-capture';
  const actionsLeft = document.createElement('div');
  actionsLeft.className = 'sala-actions-left';
  const actionsRight = document.createElement('div');
  actionsRight.className = 'sala-actions-right';
  actionsRow.appendChild(actionsLeft);
  actionsRow.appendChild(actionsRight);
  contentEl.appendChild(actionsRow);

  const addBtn = document.createElement('button');
  addBtn.className = 'add-task-btn no-capture';
  addBtn.textContent = '+ Cadastrar atividade';
  addBtn.onclick = () => showAddTaskModal(sala);
  actionsLeft.appendChild(addBtn);


  const archiveBtn = document.createElement('button');
  archiveBtn.className = 'archive-btn no-capture';
  const archiveDefaultText = isArchivedView ? 'Desarquivar sala' : 'Arquivar sala';
  archiveBtn.textContent = archiveDefaultText;
  archiveBtn.onclick = async () => {
    archiveBtn.textContent = 'Salvando...';
    archiveBtn.disabled = true;

    if (isArchivedView){
      unarchiveSala(state, sala);
    } else {
      archiveSala(state, sala);
    }

    const ok = await saveState(state);

    if (!ok){
      archiveBtn.textContent = archiveDefaultText;
      archiveBtn.disabled = false;
      alert('Não foi possível salvar agora. Tente novamente em instantes.');
      // desfaz a mudança local já que não foi possível confirmar o salvamento
      if (isArchivedView){ archiveSala(state, sala); } else { unarchiveSala(state, sala); }
      return;
    }

    activeSection = isArchivedView ? 'obras' : 'arquivadas';
    activeSala = sala;
    render();
  };
  actionsLeft.appendChild(archiveBtn);

  const board = document.createElement('div');
  board.className = 'sala-board';
  let anyEmployee = false;

  const employeesInSala = employeesFromSeed(state.seed).filter(emp => (state.seed[sala][emp] || []).length > 0);

  employeesInSala.forEach(emp => {
    const tasks = state.seed[sala][emp] || [];
    if (tasks.length === 0) return;
    anyEmployee = true;
    const card = renderGroupCard(state, emp, tasks, emp, sala);
    board.appendChild(card);
  });

  contentEl.appendChild(board);

  if (!anyEmployee){
    const emptyEl = document.createElement('div');
    emptyEl.className = 'empty';
    emptyEl.textContent = 'Nenhuma tarefa cadastrada para esta sala.';
    contentEl.appendChild(emptyEl);
  }

  contentEl.appendChild(renderWeekCalendar(
    state,
    `Calendário semanal — ${sala}`,
    (func, s) => s === sala,
    (t) => t.func
  ));
  contentEl.appendChild(renderCompletedList(
    state,
    `Tarefas concluídas — ${sala}`,
    (func, s) => s === sala,
    (t) => t.func
  ));
}

function renderEmployeeDetail(state, employee){
  const contentEl = document.getElementById('content');

  const { done, total } = employeeCounts(state, employee);
  const pct = total ? Math.round((done/total)*100) : 0;

  const nameEl = document.createElement('div');
  nameEl.className = 'employee-name';
  nameEl.textContent = employee;
  contentEl.appendChild(nameEl);

  const progressEl = document.createElement('div');
  progressEl.className = 'employee-progress';
  progressEl.innerHTML = `
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="pct">${done}/${total} tarefas</div>
  `;
  contentEl.appendChild(progressEl);

  let anyRoom = false;
  const board = document.createElement('div');
  board.className = 'sala-board';

  Object.keys(state.seed).forEach(sala => {
    if (state.archived[sala]) return;
    const tasks = (state.seed[sala] && state.seed[sala][employee]) || [];
    if (tasks.length === 0) return;
    anyRoom = true;
    const card = renderGroupCard(state, sala, tasks, employee, sala);

  });

  if (!anyRoom){

      (t) => t.sala
    ));

  contentEl.appendChild(renderCompletedList(
    state,
    `Tarefas concluídas — ${employee}`,
    (func, sala) => func === employee && !state.archived[sala],
    (t) => t.sala
  ));
}

const PANEL_COLLAPSED_KEY = 'checklist-projects-panel-collapsed-v2';
// recolhido por padrão; só fica aberto se o usuário abrir (e a escolha é lembrada)
function isProjectsPanelCollapsed(){
  try{ return localStorage.getItem(PANEL_COLLAPSED_KEY) !== '0'; }catch(e){ return true; }
}
function setProjectsPanelCollapsed(v){
  try{ localStorage.setItem(PANEL_COLLAPSED_KEY, v ? '1' : '0'); }catch(e){}
}

function showProjectDocModal(sala, index){
  const list = getProjectDocs(appState, sala);
  const current = (index !== null && index !== undefined) ? list[index] : null;
  const esc = v => String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  openModal(`
    <h3>${current ? 'Editar projeto' : 'Adicionar projeto'} — ${sala}</h3>
    <div class="modal-field">
      <label for="proj-name">Nome</label>
      <input type="text" id="proj-name" value="${current ? esc(current.name) : ''}" placeholder="Ex: Projeto elétrico" />
    </div>
    <div class="modal-field">
      <label for="proj-url">Link de visualização</label>
      <input type="text" id="proj-url" value="${current ? esc(current.url) : ''}" placeholder="https://drive.google.com/..." />
      <div class="modal-hint">No Google Drive: botão direito no arquivo → Compartilhar → "Qualquer pessoa com o link" → Copiar link.</div>
    </div>
    <div class="modal-error" id="proj-error"></div>
    <div class="modal-actions">
      ${current ? '<button class="modal-btn modal-btn-danger" id="proj-delete">Apagar</button><div style="flex:1;"></div>' : ''}
      <button class="modal-btn modal-btn-cancel" id="proj-cancel">Cancelar</button>
      <button class="modal-btn modal-btn-confirm" id="proj-confirm">Salvar</button>
    </div>
  `);
  const nameEl = document.getElementById('proj-name');
  nameEl.focus();
  document.getElementById('proj-cancel').onclick = closeModal;

  async function persist(mutator, failMsgEl, btn, idleLabel){
    const backup = JSON.stringify(appState.projectDocs || {});
    const err = mutator();
    if (err){ failMsgEl.textContent = err; failMsgEl.classList.add('show'); return; }
    failMsgEl.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Salvando...';
    const ok = await saveState(appState);
    if (!ok){
      appState.projectDocs = JSON.parse(backup);
      btn.disabled = false; btn.textContent = idleLabel;
      failMsgEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
      failMsgEl.classList.add('show');
      return;
    }
    closeModal();
    render();
  }
  const errEl = document.getElementById('proj-error');
  document.getElementById('proj-confirm').onclick = () => {
    const btn = document.getElementById('proj-confirm');
    persist(() => saveProjectDoc(appState, sala, current ? index : null,
      document.getElementById('proj-name').value, document.getElementById('proj-url').value), errEl, btn, 'Salvar');
  };
  const delBtn = document.getElementById('proj-delete');
  if (delBtn){
    delBtn.onclick = () => {
      if (!confirm(`Apagar o projeto "${current.name}" da lista? O arquivo no Drive não é afetado.`)) return;
      persist(() => { deleteProjectDoc(appState, sala, index); return null; }, errEl, delBtn, 'Apagar');
    };
  }
  document.getElementById('proj-url').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('proj-confirm').click(); });
}

/** Painel "Projetos" à direita da sala: um botão por projeto, que abre o link numa aba nova. */
function renderProjectsPanel(state, sala, layoutEl){

    panel.querySelector('.projects-expand').onclick = () => { setProjectsPanelCollapsed(false); render(); };

  }

  const head = document.createElement('div');
  head.className = 'projects-head';
  head.innerHTML = '<h3>📁 Projetos</h3><button type="button" class="projects-collapse" title="Recolher painel">»</button>';
  head.querySelector('.projects-collapse').onclick = () => { setProjectsPanelCollapsed(true); render(); };
  panel.appendChild(head);

  if (docs.length === 0){
    const empty = document.createElement('p');
    empty.className = 'projects-empty';
    empty.textContent = 'Nenhum projeto adicionado nesta sala.';
    panel.appendChild(empty);
  } else {
    const listEl = document.createElement('div');
    listEl.className = 'projects-list';
    docs.forEach((doc, idx) => {
      const row = document.createElement('div');
      row.className = 'project-item';
      const open = document.createElement('button');
      open.type = 'button';
      open.className = 'project-open';
      open.title = doc.url;
      const icon = document.createElement('span'); icon.textContent = '📄';
      const nm = document.createElement('span'); nm.className = 'project-name'; nm.textContent = doc.name;
      open.appendChild(icon); open.appendChild(nm);
      open.onclick = () => window.open(doc.url, '_blank', 'noopener');
      const edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'project-edit';
      edit.title = 'Editar projeto';
      edit.innerHTML = EDIT_ICON_SVG;
      edit.onclick = () => showProjectDocModal(sala, idx);
      row.appendChild(open); row.appendChild(edit);
      listEl.appendChild(row);
    });
    panel.appendChild(listEl);
  }

  const add = document.createElement('button');
  add.type = 'button';
  add.className = 'projects-add';
  add.textContent = '+ Adicionar projeto';
  add.onclick = () => showProjectDocModal(sala, null);
  panel.appendChild(add);
  return panel;
}

/** Envolve o conteúdo já montado da sala num layout de duas colunas (conteúdo + painel de projetos). */
function wrapSalaWithProjectsPanel(state, sala){
  const contentEl = document.getElementById('content');
  const layout = document.createElement('div');
  layout.className = 'sala-layout' + (isProjectsPanelCollapsed() ? ' panel-collapsed' : '');
  const mainCol = document.createElement('div');
  mainCol.style.minWidth = '0';
  while (contentEl.firstChild) mainCol.appendChild(contentEl.firstChild);
  layout.appendChild(mainCol);
  layout.appendChild(renderProjectsPanel(state, sala, layout));
  contentEl.appendChild(layout);
}

const BASE_VIEW_ID = '__checklist_base__';

function showBaseItemModal(index){
  const list = getBaseTemplate(appState);
  const current = (index !== null && index !== undefined) ? list[index] : null;
  const funcs = Array.from(new Set(employeesFromSeed(appState.seed).concat(list.map(it => it.func))))
    .filter(f => f !== 'Compras').sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const optionsHtml = funcs.map(f => `<option value="${f}"${current && current.func === f ? ' selected' : ''}>${f}</option>`).join('');
  const esc = v => String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const isFutureNow = !!(current && current.future);

  openModal(`
    <h3>${current ? 'Editar atividade padrão' : 'Nova atividade padrão'}</h3>
    ${current ? '' : `
    <div class="modal-field">
      <label>Modo de cadastro</label>
      <div class="mode-toggle">
        <button type="button" class="mode-btn active" id="base-mode-unica">Única</button>
        <button type="button" class="mode-btn" id="base-mode-multi">Múltiplas</button>
      </div>
    </div>`}
    <div class="modal-field" id="base-text-field">
      <label for="base-text">Atividade</label>
      <input type="text" id="base-text" value="${current ? esc(current.text) : ''}" placeholder="Ex: Executar infra de tomadas" />
    </div>
    <div class="modal-field" id="base-text-multi-field" style="display:none;">
      <label for="base-text-multi">Atividades (uma por linha)</label>
      <textarea id="base-text-multi" rows="6" placeholder="Executar infra de tomadas
Executar infra de interruptores
Instalar iluminação"></textarea>
      <div class="modal-hint">Cada linha vira uma atividade padrão, todas com o mesmo responsável e "Atual/Futura" abaixo.</div>
    </div>
    <div class="modal-field">
      <label for="base-func-select">Responsável</label>
      <select id="base-func-select">
        ${optionsHtml}
        <option value="__new__"${funcs.length ? '' : ' selected'}>Outro (digitar nome novo)</option>
      </select>
    </div>
    <div class="modal-field" id="base-func-new-field" style="display:${funcs.length ? 'none' : 'block'};">
      <label for="base-func-new">Nome do responsável</label>
      <input type="text" id="base-func-new" placeholder="Ex: Eletricista" />
    </div>
    <div class="modal-field" id="base-subitems-field">
      <label for="base-subitems">Subitens (opcional, um por linha)</label>
      <textarea id="base-subitems" rows="4" placeholder="Finalizar perfis
Finalizar vigas">${current ? esc(current.subitems.join('\n')) : ''}</textarea>
    </div>
    <div class="modal-field">
      <label>Quando?</label>
      <div class="mode-toggle">
        <button type="button" class="mode-btn${isFutureNow ? '' : ' active'}" id="base-timing-atual">Atual</button>
        <button type="button" class="mode-btn${isFutureNow ? ' active' : ''}" id="base-timing-futura">Futura</button>
      </div>
      <div class="modal-hint">"Futura" já entra guardada na sala nova, até ser liberada.</div>
    </div>
    <div class="modal-hint">Textos com "Comprar"/"Compra" vão automaticamente pra aba Compras.</div>
    <div class="modal-error" id="base-error"></div>
    <div class="modal-actions">
      ${current ? '<button class="modal-btn modal-btn-danger" id="base-delete">Apagar</button><div style="flex:1;"></div>' : ''}
      <button class="modal-btn modal-btn-cancel" id="base-cancel">Cancelar</button>
      <button class="modal-btn modal-btn-confirm" id="base-confirm">Salvar</button>
    </div>
  `);

  const funcSelect = document.getElementById('base-func-select');
  const funcNewField = document.getElementById('base-func-new-field');
  funcSelect.addEventListener('change', () => {
    funcNewField.style.display = funcSelect.value === '__new__' ? 'block' : 'none';
  });
  let future = isFutureNow;
  const tAtual = document.getElementById('base-timing-atual');
  const tFutura = document.getElementById('base-timing-futura');
  tAtual.onclick = () => { future = false; tAtual.classList.add('active'); tFutura.classList.remove('active'); };
  tFutura.onclick = () => { future = true; tFutura.classList.add('active'); tAtual.classList.remove('active'); };

  let baseMode = 'unica';
  const modeUnica = document.getElementById('base-mode-unica');
  const modeMulti = document.getElementById('base-mode-multi');
  const confirmEl = document.getElementById('base-confirm');
  function setBaseMode(mode){
    baseMode = mode;
    modeUnica.classList.toggle('active', mode === 'unica');
    modeMulti.classList.toggle('active', mode === 'multiplas');
    document.getElementById('base-text-field').style.display = mode === 'unica' ? 'block' : 'none';
    document.getElementById('base-text-multi-field').style.display = mode === 'multiplas' ? 'block' : 'none';
    // subitens só no modo "Única" (em "Múltiplas" cada linha é uma atividade separada)
    document.getElementById('base-subitems-field').style.display = mode === 'unica' ? 'block' : 'none';
    confirmEl.textContent = mode === 'unica' ? 'Salvar' : 'Salvar todas';
    (mode === 'unica' ? document.getElementById('base-text') : document.getElementById('base-text-multi')).focus();
  }
  if (modeUnica && modeMulti){
    modeUnica.onclick = () => setBaseMode('unica');
    modeMulti.onclick = () => setBaseMode('multiplas');
  }

  document.getElementById('base-cancel').onclick = closeModal;
  const delBtn = document.getElementById('base-delete');
  if (delBtn){
    delBtn.onclick = async () => {
      if (!confirm(`Apagar "${current.text}" do checklist base? As salas já criadas não são afetadas.`)) return;
      deleteBaseItem(appState, index);
      const ok = await saveState(appState);
      if (!ok){
        const errEl = document.getElementById('base-error');
        errEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
        errEl.classList.add('show');
        return;
      }
      closeModal();
      render();
    };
  }
  document.getElementById('base-confirm').onclick = async () => {
    const errEl = document.getElementById('base-error');
    const func = funcSelect.value === '__new__' ? document.getElementById('base-func-new').value.trim() : funcSelect.value;
    const btn = document.getElementById('base-confirm');
    const idleLabel = btn.textContent;

    if (!current && baseMode === 'multiplas'){
      const lines = parseSubitemTexts(document.getElementById('base-text-multi').value); // limpa linhas vazias e repetidas
      if (lines.length === 0){ errEl.textContent = 'Digite pelo menos uma atividade (uma por linha).'; errEl.classList.add('show'); return; }
      if (!func){ errEl.textContent = 'Escolha ou digite um responsável.'; errEl.classList.add('show'); return; }
      let added = 0;
      lines.forEach(t => { if (saveBaseItem(appState, null, func, t, [], future)) added++; });
      if (added === 0){
        errEl.textContent = 'Todas essas atividades já existem para esse responsável no checklist base.';
        errEl.classList.add('show');
        return;
      }
      errEl.classList.remove('show');
      btn.textContent = 'Salvando...'; btn.disabled = true;
      const okMulti = await saveState(appState);
      if (!okMulti){
        btn.textContent = idleLabel; btn.disabled = false;
        errEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
        errEl.classList.add('show');
        return;
      }
      closeModal();
      render();
      return;
    }

    const text = document.getElementById('base-text').value.trim();
    if (!text){ errEl.textContent = 'Digite o texto da atividade.'; errEl.classList.add('show'); return; }
    if (!func){ errEl.textContent = 'Escolha ou digite um responsável.'; errEl.classList.add('show'); return; }
    const subs = parseSubitemTexts(document.getElementById('base-subitems').value);
    if (!saveBaseItem(appState, (current ? index : null), func, text, subs, future)){
      errEl.textContent = 'Já existe essa atividade para esse responsável no checklist base.';
      errEl.classList.add('show');
      return;
    }
    btn.textContent = 'Salvando...'; btn.disabled = true;
    const ok = await saveState(appState);
    if (!ok){
      btn.textContent = idleLabel; btn.disabled = false;
      errEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
      errEl.classList.add('show');
      return;
    }
    closeModal();
    render();
  };
}

function renderContent(state){
  const contentEl = document.getElementById('content');
  contentEl.innerHTML = '';

  const allSalas = Object.keys(state.seed);
  const activeSalas = allSalas.filter(s => !state.archived[s]);
  const archivedSalas = allSalas.filter(s => !!state.archived[s]);

  if (activeSection === 'calendario'){
    const nameEl = document.createElement('div');
    nameEl.className = 'employee-name';
    nameEl.textContent = 'Calendário semanal — geral';
    contentEl.appendChild(nameEl);
    contentEl.appendChild(renderWeekCalendar(
      state,
      'Todas as salas e prestadores',
      (func, sala) => !state.archived[sala],
      (t) => `${t.func} · ${t.sala}`
    ));
    return;
  }

  if (activeSection === 'obras'){
    if (!activeSala || !activeSalas.includes(activeSala)){
      renderSalaAggregate(state, activeSalas, 'Obras — todas as salas', 'Nenhuma sala cadastrada ainda. Clique em "+ Nova sala" no menu lateral (Obras) para começar.');
      return;
    }
    renderSalaDetail(state, activeSala, false);
    wrapSalaWithProjectsPanel(state, activeSala);
    return;
  }

  if (activeSection === 'arquivadas'){
    if (activeSala === BASE_VIEW_ID){
      renderBaseEditor(state);
      return;
    }
    if (!activeSala || !archivedSalas.includes(activeSala)){
      renderSalaAggregate(state, archivedSalas, 'Arquivadas', 'Nenhuma sala arquivada.');
      return;
    }
    renderSalaDetail(state, activeSala, true);
    wrapSalaWithProjectsPanel(state, activeSala);
    return;
  }

  if (activeSection === 'compras'){
    renderEmployeeDetail(state, 'Compras');
    return;
  }

  // prestadores
  if (!activeEmployee){
    contentEl.innerHTML = '<div class="empty">Nenhum funcionário encontrado.</div>';
    return;
  }
  renderEmployeeDetail(state, activeEmployee);
}

function renderGeralCard(state, sala){
  const card = document.createElement('div');
  card.className = 'sala-card';

  const employeesInSala = employeesFromSeed(state.seed).filter(emp => (state.seed[sala][emp] || []).length > 0);
  const allTasks = [];
  employeesInSala.forEach(emp => {
    (state.seed[sala][emp] || []).map(taskInfo).forEach(({ text }) => {
      allTasks.push({ func: emp, text, key: taskKey(emp, sala, text) });
    });
  });

  const currentTasks = allTasks.filter(t => !isFuture(state, t.key));
  const futureTasks = allTasks.filter(t => isFuture(state, t.key));
  const groupDone = currentTasks.filter(t => state.done[t.key]).length;
  const activeTasks = currentTasks.filter(t => !state.done[t.key]);

  const head = document.createElement('div');
  head.className = 'sala-head';
  head.innerHTML = `<h3>${sala}</h3><span class="sala-count">${groupDone}/${currentTasks.length}</span>`;
  card.appendChild(head);

  const list = document.createElement('ul');
  list.className = 'task-list';

  if (activeTasks.length === 0){
    list.innerHTML = futureTasks.length
      ? '<li class="task-list-empty">Nenhuma atividade atual pendente.</li>'
      : '<li class="task-list-empty">Tudo concluído por aqui 🎉</li>';
  }

  activeTasks.forEach(({ func, text }) => {
    list.appendChild(renderTaskItem(state, func, sala, text, { showContext: true }));
  });

  card.appendChild(list);

  if (futureTasks.length){
    card.appendChild(renderFutureBlock(
      'geral|' + sala,
      futureTasks.map(({ func, text }) => renderFutureItem(state, func, sala, text, { showContext: true }))
    ));
  }
  return card;
}

/**
 * Visão agregada de um conjunto de salas (usada por "Obras" sem sala
 * selecionada e por "Arquivadas" sem sala selecionada): um cartão por sala
 * + o calendário semanal restrito a essas salas.
 */
function renderSalaAggregate(state, salas, title, emptyMessage){
  const contentEl = document.getElementById('content');

  const keys = countableKeys(state).filter(k => salas.includes(parseKey(k).sala));
  const total = keys.length;
  const done = keys.filter(k => state.done[k]).length;
  const pct = total ? Math.round((done/total)*100) : 0;

  const nameEl = document.createElement('div');
  nameEl.className = 'employee-name';
  nameEl.textContent = title;
  contentEl.appendChild(nameEl);

  const progressEl = document.createElement('div');
  progressEl.className = 'employee-progress';
  progressEl.innerHTML = `
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="pct">${done}/${total} tarefas</div>
  `;
  contentEl.appendChild(progressEl);

  if (salas.length === 0){
    const emptyEl = document.createElement('div');
    emptyEl.className = 'empty';
    emptyEl.textContent = emptyMessage;
    contentEl.appendChild(emptyEl);
    return;
  }

  const board = document.createElement('div');
  board.className = 'sala-board';
  salas.forEach(sala => {
    board.appendChild(renderGeralCard(state, sala));
  });
  contentEl.appendChild(board);

  contentEl.appendChild(renderWeekCalendar(
    state,
    `Calendário semanal — ${title}`,
    (func, sala) => salas.includes(sala),
    (t) => `${t.func} · ${t.sala}`
  ));
}

/**
 * Botão geral "Exibir/Ocultar atividades futuras": abre ou fecha, de uma vez,
 * todos os blocos "Futuras" da tela atual. Só aparece se houver alguma futura.
 * Fica fora da imagem baixada (no-capture).
 */
function refreshFutureToggleAll(){
  const btn = document.querySelector('#content .future-toggle-all');
  if (!btn) return;
  const blocks = Array.from(document.querySelectorAll('#content .future-block'));
  const allOpen = blocks.length > 0 && blocks.every(b => b.classList.contains('open'));
  btn.textContent = allOpen ? 'Ocultar atividades futuras' : 'Exibir atividades futuras';
  btn.title = allOpen ? 'Recolher todas as atividades futuras' : 'Expandir todas as atividades futuras';
}

function renderFutureToggleAll(){
  const contentEl = document.getElementById('content');
  if (!contentEl) return;
  contentEl.querySelectorAll('.future-toggle-all, .future-toggle-row').forEach(el => el.remove());
  const blocks = Array.from(contentEl.querySelectorAll('.future-block'));
  if (blocks.length === 0) return;

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'archive-btn future-toggle-all no-capture';
  btn.addEventListener('click', () => {
    const current = Array.from(contentEl.querySelectorAll('.future-block'));
    const allOpen = current.every(b => b.classList.contains('open'));
    current.forEach(b => {
      b.classList.toggle('open', !allOpen);
      const id = b.dataset.blockId;
      if (!id) return;
      if (allOpen) openFutureBlocks.delete(id); else openFutureBlocks.add(id);
    });
    refreshFutureToggleAll();
  });

  const left = contentEl.querySelector('.sala-actions-left');
  if (left){
    left.appendChild(btn);
  } else {
    const row = document.createElement('div');
    row.className = 'sala-actions-row future-toggle-row no-capture';
    row.style.margin = '0 0 14px';
    row.appendChild(btn);
    const progress = contentEl.querySelector('.employee-progress');
    if (progress && progress.parentNode === contentEl) progress.after(row);
    else contentEl.prepend(row);
  }
  refreshFutureToggleAll();
}

function render(){
  if (!appState) return;
  renderHeaderProgress(appState);
  renderNav(appState);
  renderContent(appState);
  renderFutureToggleAll();
}

document.getElementById('download-img-btn').addEventListener('click', async () => {
  const btn = document.getElementById('download-img-btn');
  const originalText = btn.textContent;
  btn.textContent = 'Gerando...';
  btn.disabled = true;
  try{
    const target = document.querySelector('.wrap');
    const isDark = document.body.classList.contains('theme-dark');
    const canvas = await html2canvas(target, {
      backgroundColor: isDark ? '#0E1428' : '#F4F6FB',
      scale: 2,
      ignoreElements: (el) => el.classList && el.classList.contains('no-capture'),
      onclone: (doc) => {
        // o painel de projetos não sai na imagem — e a coluna dele também não fica em branco
        doc.querySelectorAll('.projects-panel').forEach(el => { el.style.display = 'none'; });
        doc.querySelectorAll('.sala-layout').forEach(el => { el.style.display = 'block'; });
      }
    });
    let label = 'checklist';
    if (activeSection === 'calendario') label = 'calendario-geral';
    else if (activeSection === 'compras') label = 'compras';
    else if (activeSection === 'prestadores') label = activeEmployee || 'prestador';
    else label = activeSala || activeSection; // obras / arquivadas
    const slug = label.toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const filename = `checklist-conceito-${slug}.png`;

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!blob) throw new Error('Falha ao converter a captura em imagem.');

    const downloadsCap = await getDownloadsCapability();
    if (downloadsCap){
      // página publicada: um link de download comum fica inerte aqui —
      // precisa passar pela capability de downloads, que pede confirmação
      // do visitante antes de salvar.
      try{
        await downloadsCap.save({ filename, data: blob });
      }catch(saveErr){
        if (saveErr && saveErr.code === 'declined'){
          // visitante cancelou o salvamento — não é um erro de verdade
        } else {
          throw saveErr;
        }
      }
    } else {
      // prévia da conversa no chat: o link de download comum funciona normalmente
      const link = document.createElement('a');
      link.download = filename;
      link.href = URL.createObjectURL(blob);
      link.click();
      URL.revokeObjectURL(link.href);
    }
  }catch(e){
    console.error('Falha ao gerar imagem', e);
    alert('Não foi possível gerar a imagem agora. Tente novamente em instantes.');
  }finally{
    btn.textContent = originalText;
    btn.disabled = false;
  }
});

    <div class="modal-field">
      <label>Usar checklist base?</label>
      <div class="mode-toggle">
        <button type="button" class="mode-btn active" id="base-btn-nao">Não</button>
        <button type="button" class="mode-btn" id="base-btn-sim"${baseCount ? '' : ' disabled'}>Sim</button>
      </div>
      <div class="modal-hint">${baseCount
        ? `Já cadastra ${baseCount} atividade${baseCount > 1 ? 's' : ''} padrão${baseFuture ? ` (${baseFuture} futura${baseFuture > 1 ? 's' : ''})` : ''} na sala nova.`
        : 'O checklist base está vazio. Monte-o em Arquivadas → ⚙ Checklist base.'}</div>
    </div>
    <div class="modal-error" id="new-sala-error"></div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" id="new-sala-cancel">Cancelar</button>
      <button class="modal-btn modal-btn-confirm" id="new-sala-confirm">Criar sala</button>
    </div>
  `);

  const input = document.getElementById('new-sala-name');
  input.focus();

  let useBase = false;
  const baseBtnNao = document.getElementById('base-btn-nao');
  const baseBtnSim = document.getElementById('base-btn-sim');
  baseBtnNao.onclick = () => { useBase = false; baseBtnNao.classList.add('active'); baseBtnSim.classList.remove('active'); };
  baseBtnSim.onclick = () => { if (!baseCount) return; useBase = true; baseBtnSim.classList.add('active'); baseBtnNao.classList.remove('active'); };

  document.getElementById('new-sala-cancel').onclick = closeModal;
  document.getElementById('new-sala-confirm').onclick = async () => {
    const name = input.value.trim();
    const errEl = document.getElementById('new-sala-error');
    const confirmBtn = document.getElementById('new-sala-confirm');
    if (!name){
      errEl.textContent = 'Digite um nome pra sala.';
      errEl.classList.add('show');
      return;
    }
    if (appState.seed[name]){
      errEl.textContent = 'Já existe uma sala com esse nome.';
      errEl.classList.add('show');
      return;
    }

    errEl.classList.remove('show');
    confirmBtn.textContent = 'Criando...';
    confirmBtn.disabled = true;

    addCustomSala(appState, name);
    if (useBase) applyBaseTemplate(appState, name);
    const ok = await saveState(appState);

    if (!ok){
      confirmBtn.textContent = 'Criar sala';
      confirmBtn.disabled = false;
      errEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
      errEl.classList.add('show');
      return;
    }

    activeSection = 'obras';
    activeSala = name;
    closeModal();
    render();
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('new-sala-confirm').click();
  });
}

    priorityBtnSim.classList.add('active');
    priorityBtnNao.classList.remove('active');
  };

  const funcSelect = document.getElementById('task-func-select');
  const funcNewField = document.getElementById('task-func-new-field');

  const timingBtnAtual = document.getElementById('timing-btn-atual');
  const timingBtnFutura = document.getElementById('timing-btn-futura');

    isFutureTask = future;
    timingBtnAtual.classList.toggle('active', !future);
    timingBtnFutura.classList.toggle('active', future);
    updateDaysVisibility();
  }
  timingBtnAtual.onclick = () => setTiming(false);
  timingBtnFutura.onclick = () => setTiming(true);

  function updateDaysVisibility(){
    const isCompraNow = mode === 'unica'
      ? (isPurchaseTask(textInput.value) || funcSelect.value === 'Compras')
      : funcSelect.value === 'Compras';
    daysField.style.display = (isCompraNow || isFutureTask) ? 'none' : 'block';

    subitemsField.style.display = (mode === 'unica' && !isCompraNow) ? 'block' : 'none';
  }
  textInput.addEventListener('input', updateDaysVisibility);
  funcSelect.addEventListener('change', () => {
    funcNewField.style.display = funcSelect.value === '__new__' ? 'block' : 'none';

  });
  funcNewField.style.display = funcSelect.value === '__new__' ? 'block' : 'none';

  document.querySelectorAll('.modal-day-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const day = chip.dataset.day;
      if (selectedDays.has(day)){
        selectedDays.delete(day);
        chip.classList.remove('active');
      } else {
        selectedDays.add(day);
        chip.classList.add('active');
      }
    });

    } else {
      texts = textMultiInput.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        errEl.textContent = 'Digite pelo menos uma atividade (uma por linha).';

        return;
      }

    if (!chosenFunc){
      errEl.textContent = 'Escolha ou digite um responsável.';
      errEl.classList.add('show');
      return;
    }

    errEl.classList.remove('show');
    const originalLabel = confirmBtn.textContent;
    confirmBtn.textContent = 'Salvando...';
    confirmBtn.disabled = true;

    const subTexts = mode === 'unica' ? parseSubitemTexts(subitemsInput.value) : [];
    texts.forEach(t => {
      addCustomTask(appState, sala, chosenFunc, t, Array.from(selectedDays), needsMaterial, priorityOn, subTexts, isFutureTask);

    if (!ok){
      confirmBtn.textContent = originalLabel;
      confirmBtn.disabled = false;
      errEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
      errEl.classList.add('show');
      return;
    }

    closeModal();
    render();
  };
}

/**
 * Modo de cadastro rápido — ativado pelo link .../index.html?modo=cadastro
 * (pra usar num QR Code fixado na obra). Mostra só um formulário protegido
 * por PIN pra cadastrar uma atividade, sem o resto do dashboard.
 */
const urlParams = new URLSearchParams(window.location.search);
const isQuickAddMode = urlParams.get('modo') === 'cadastro';
const QUICK_ADD_PIN = "1303";
const QUICK_ADD_SESSION_KEY = 'conceito-checklist-quickadd-unlocked';

async function initQuickAddMode(){
  initTheme();
  document.body.innerHTML = `
    <div class="quick-wrap">
      <div class="quick-card">
        <div class="quick-logo"><img id="quick-logo-img" alt="Conceito Engenharia" /></div>
        <h1>Cadastro rápido de atividade</h1>
        <div id="quick-content"></div>
      </div>
    </div>
  `;
  document.getElementById('quick-logo-img').src = "data:image/png;base64," + LOGO_B64;

  let unlocked = false;
  try{ unlocked = sessionStorage.getItem(QUICK_ADD_SESSION_KEY) === 'yes'; }catch(e){}

  if (!unlocked){
    renderQuickPinGate();
  } else {
    await renderQuickForm();
  }
}

function renderQuickPinGate(){
  const el = document.getElementById('quick-content');
  el.innerHTML = `
    <p class="quick-sub">Digite o código de acesso pra cadastrar uma atividade.</p>
    <div class="modal-field">
      <input type="password" id="quick-pin-input" inputmode="numeric" placeholder="Código" />
    </div>
    <div class="modal-error" id="quick-pin-error"></div>
    <button class="quick-btn" id="quick-pin-confirm">Entrar</button>
  `;
  const input = document.getElementById('quick-pin-input');
  input.focus();
  const tryUnlock = async () => {
    if (input.value.trim() === QUICK_ADD_PIN){
      try{ sessionStorage.setItem(QUICK_ADD_SESSION_KEY, 'yes'); }catch(e){}
      await renderQuickForm();
    } else {
      const errEl = document.getElementById('quick-pin-error');
      errEl.textContent = 'Código incorreto.';
      errEl.classList.add('show');
      input.value = '';
      input.focus();
    }
  };
  document.getElementById('quick-pin-confirm').onclick = tryUnlock;
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
}

async function renderQuickForm(){
  const el = document.getElementById('quick-content');
  el.innerHTML = '<p class="quick-sub">Carregando...</p>';

  if (!appState){
    appState = await loadState();
  }

  const salas = Object.keys(appState.seed).filter(s => !appState.archived[s]);
  const employees = employeesFromSeed(appState.seed);

  const salaOptionsHtml = salas.map(s => `<option value="${s}">${s}</option>`).join('');
  const funcOptionsHtml = employees.map(e => `<option value="${e}">${e}</option>`).join('');
  const dayButtonsHtml = DAYS.map(({ code, label }) =>
    `<button type="button" class="modal-day-chip" data-day="${code}">${label}</button>`
  ).join('');

  el.innerHTML = `
    <p class="quick-sub">Preencha os dados da atividade.</p>
    <div class="modal-field">
      <label for="quick-text">Atividade</label>
      <input type="text" id="quick-text" placeholder="Ex: Instalar porta do banheiro" />
    </div>
    <div class="modal-field">
      <label for="quick-sala-select">Sala</label>
      <select id="quick-sala-select">
        ${salaOptionsHtml}
        <option value="__new__">Outro (nova sala)</option>
      </select>
    </div>
    <div class="modal-field" id="quick-sala-new-field" style="display:none;">
      <label for="quick-sala-new">Nome da nova sala</label>
      <input type="text" id="quick-sala-new" placeholder="Ex: Sala 1301" />
    </div>
    <div class="modal-field">
      <label for="quick-func-select">Responsável</label>
      <select id="quick-func-select">
        ${funcOptionsHtml}
        <option value="__new__">Outro (digitar nome novo)</option>
      </select>
    </div>
    <div class="modal-field" id="quick-func-new-field" style="display:none;">
      <label for="quick-func-new">Nome do novo responsável</label>
      <input type="text" id="quick-func-new" placeholder="Ex: Neto" />
    </div>
    <div class="modal-field">
      <label>Quando?</label>
      <div class="mode-toggle">
        <button type="button" class="mode-btn active" id="quick-timing-atual">Atual</button>
        <button type="button" class="mode-btn" id="quick-timing-futura">Futura</button>
      </div>
    </div>
    <div class="modal-field" id="quick-days-field">
      <label>Dias (opcional)</label>
      <div class="modal-days">${dayButtonsHtml}</div>
    </div>
    <div class="quick-hint">Atividades com "Comprar"/"Compra" no texto vão automaticamente pra aba Compras.</div>
    <div class="modal-error" id="quick-form-error"></div>
    <div class="quick-success" id="quick-form-success"></div>
    <button class="quick-btn" id="quick-form-confirm">Cadastrar atividade</button>
  `;

  const textInput = document.getElementById('quick-text');
  textInput.focus();

  const salaSelect = document.getElementById('quick-sala-select');
  const salaNewField = document.getElementById('quick-sala-new-field');
  salaSelect.addEventListener('change', () => {
    salaNewField.style.display = salaSelect.value === '__new__' ? 'block' : 'none';
  });

  const funcSelect = document.getElementById('quick-func-select');
  const funcNewField = document.getElementById('quick-func-new-field');
  funcSelect.addEventListener('change', () => {
    funcNewField.style.display = funcSelect.value === '__new__' ? 'block' : 'none';
  });

  let quickFuture = false;
  const quickTimingAtual = document.getElementById('quick-timing-atual');
  const quickTimingFutura = document.getElementById('quick-timing-futura');
  const quickDaysField = document.getElementById('quick-days-field');
  function setQuickTiming(future){
    quickFuture = future;
    quickTimingAtual.classList.toggle('active', !future);
    quickTimingFutura.classList.toggle('active', future);
    quickDaysField.style.display = future ? 'none' : 'block';
  }
  quickTimingAtual.onclick = () => setQuickTiming(false);
  quickTimingFutura.onclick = () => setQuickTiming(true);

  const selectedDays = new Set();
  document.querySelectorAll('#quick-content .modal-day-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const day = chip.dataset.day;
      if (selectedDays.has(day)){ selectedDays.delete(day); chip.classList.remove('active'); }
      else { selectedDays.add(day); chip.classList.add('active'); }
    });
  });

  document.getElementById('quick-form-confirm').onclick = async () => {
    const errEl = document.getElementById('quick-form-error');
    const successEl = document.getElementById('quick-form-success');
    const confirmBtn = document.getElementById('quick-form-confirm');
    errEl.classList.remove('show');
    successEl.classList.remove('show');

    const text = textInput.value.trim();
    const sala = salaSelect.value === '__new__' ? document.getElementById('quick-sala-new').value.trim() : salaSelect.value;
    const func = funcSelect.value === '__new__' ? document.getElementById('quick-func-new').value.trim() : funcSelect.value;

    if (!text){ errEl.textContent = 'Digite o texto da atividade.'; errEl.classList.add('show'); return; }
    if (!sala){ errEl.textContent = 'Escolha ou digite uma sala.'; errEl.classList.add('show'); return; }
    if (!func){ errEl.textContent = 'Escolha ou digite um responsável.'; errEl.classList.add('show'); return; }

    confirmBtn.textContent = 'Salvando...';
    confirmBtn.disabled = true;

    const criouNovoAlgo = salaSelect.value === '__new__' || funcSelect.value === '__new__';
    addCustomTask(appState, sala, func, text, Array.from(selectedDays), false, false, [], quickFuture);
    const ok = await saveState(appState);

    if (!ok){
      confirmBtn.textContent = 'Cadastrar atividade';
      confirmBtn.disabled = false;
      errEl.textContent = 'Não foi possível salvar agora. Tente novamente em instantes.';
      errEl.classList.add('show');
      return;
    }

    if (criouNovoAlgo){
      // recarrega o formulário pra incluir a sala/responsável recém-criados nas listas
      await renderQuickForm();
    } else {
      textInput.value = '';
      selectedDays.clear();
      document.querySelectorAll('#quick-content .modal-day-chip.active').forEach(chip => chip.classList.remove('active'));
      setQuickTiming(false);
      confirmBtn.textContent = 'Cadastrar atividade';
      confirmBtn.disabled = false;
      textInput.focus();
    }
    document.getElementById('quick-form-success').textContent = '✅ Atividade cadastrada!';
    document.getElementById('quick-form-success').classList.add('show');
  };
}

(async function init(){
  if (isQuickAddMode){
    await initQuickAddMode();
    return;
  }
  document.getElementById('footer').textContent = 'Carregando checklist salva...';
  appState = await loadState();
  render();
})();
</script>
</body>
</html>
